<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<!-- wrapped-for-pages -->
<title>Headwaters</title>
<style>
  :root{
    --bg:#0b1016; --bg2:#0f151d; --panel:#121a24; --line:#1f2b38; --line2:#2a3a4c;
    --ink:#dfe8f2; --dim:#8ba0b6; --dimmer:#5f748a;
    --ok:#4ec9a0; --bad:#e8646a; --dead:#6b7c8f; --warn:#e0b054;
    --accent:#5fb3f0; --accent2:#7ee0c4;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header{border-bottom:1px solid var(--line);padding:22px 26px 18px;background:
    radial-gradient(120% 140% at 0% 0%, #14202c 0%, var(--bg) 62%)}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:23px;letter-spacing:-.4px;font-weight:650}
  h1 .drop{color:var(--accent2)}
  .tag{color:var(--dim);font-size:13.5px;max-width:62ch}
  .stats{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
  .stat b{display:block;font-size:19px;font-weight:600;letter-spacing:-.3px;font-family:var(--sans)}
  .stat span{color:var(--dimmer);text-transform:uppercase;letter-spacing:.09em;font-size:10px}
  .stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.dead b{color:var(--dead)}

  .wrap{display:grid;grid-template-columns:232px minmax(0,1fr);gap:0;min-height:calc(100vh - 132px)}
  aside{border-right:1px solid var(--line);padding:18px 16px 60px;position:sticky;top:0;align-self:start;
        max-height:100vh;overflow:auto}
  .facet{margin-bottom:20px}
  .facet h3{margin:0 0 7px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer);font-weight:600}
  .facet button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;
    color:var(--dim);font:inherit;font-size:13px;padding:2.5px 6px;border-radius:5px;cursor:pointer;line-height:1.4}
  .facet button:hover{background:var(--bg2);color:var(--ink)}
  .facet button.on{background:#17304a;color:#cfe6ff}
  .facet button i{font-style:normal;color:var(--dimmer);font-family:var(--mono);font-size:11px}

  main{padding:18px 26px 90px;min-width:0}
  .searchrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
  #q{flex:1;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;
     padding:9px 12px;font:14px var(--sans);outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px #5fb3f022}
  .modes{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:2px}
  .modes button{background:none;border:0;color:var(--dim);font:12px var(--sans);padding:6px 11px;border-radius:6px;cursor:pointer}
  .modes button.on{background:#17304a;color:#cfe6ff}
  .count{color:var(--dimmer);font-size:12px;font-family:var(--mono);margin:8px 0 14px}

  .card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;background:var(--bg2);cursor:pointer;
        transition:border-color .12s,background .12s}
  .card:hover{border-color:var(--line2);background:#121b25}
  .card.sel{border-color:var(--accent);background:#101c28}
  .card h2{margin:0 0 3px;font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pub{color:var(--dimmer);font-size:12px;font-weight:400}
  .card p{margin:5px 0 8px;color:var(--dim);font-size:13.5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .chip{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line2);
    border-radius:20px;padding:1.5px 8px;white-space:nowrap}
  .chip.k{border-color:#3a4a2f;color:#b9d08e}
  .chip.warnc{border-color:#4a3f20;color:var(--warn)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px #4ec9a066}
  .dot.bad{background:var(--bad);box-shadow:0 0 8px #e8646a66}
  .dot.dead{background:var(--dead)}
  .dot.net{background:var(--warn);box-shadow:0 0 8px #e0b05455}
  .dot.none{background:var(--line2)}

  /* detail */
  .sheet{position:fixed;inset:0 0 0 auto;width:min(760px,94vw);background:var(--panel);border-left:1px solid var(--line2);
    overflow:auto;padding:24px 28px 90px;box-shadow:-30px 0 60px #0006;transform:translateX(100%);transition:transform .16s ease-out;z-index:9}
  .sheet.open{transform:none}
  .sheet .x{position:absolute;top:14px;right:18px;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer;line-height:1}
  .sheet h2{margin:0 0 2px;font-size:22px;letter-spacing:-.4px}
  .sheet .lede{color:var(--dim);font-size:14px;margin:10px 0 18px}
  .sheet h4{margin:22px 0 8px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer)}
  table.kv{width:100%;border-collapse:collapse;font-size:13px}
  table.kv td{padding:5px 0;vertical-align:top;border-bottom:1px solid var(--line)}
  table.kv td:first-child{color:var(--dimmer);width:132px;font-family:var(--mono);font-size:11.5px;padding-right:12px}
  .probe{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;background:var(--bg2)}
  .probe .top{display:flex;align-items:center;gap:9px;font-size:13px}
  .probe code{font-family:var(--mono);font-size:11.5px;color:var(--dim);word-break:break-all;display:block;margin-top:5px}
  .probe .meta{font-family:var(--mono);font-size:11px;color:var(--dimmer);margin-left:auto;white-space:nowrap}
  .probe .why{color:var(--bad);font-size:12px;margin-top:5px}
  .probe .note{color:var(--warn);font-size:12px;margin-top:5px}
  .gotcha{border-left:2px solid var(--warn);padding:2px 0 2px 12px;margin:0 0 11px}
  .gotcha .t{font-size:13.5px}
  .gotcha .f{font-size:13px;color:var(--dim);margin-top:3px}
  .gotcha .f b{color:var(--accent2);font-weight:600}
  pre{background:#0a0f15;border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow:auto;
      font-family:var(--mono);font-size:11.5px;line-height:1.5;margin:0 0 10px;position:relative}
  .copy{position:absolute;top:6px;right:6px;background:var(--bg2);border:1px solid var(--line2);color:var(--dim);
    border-radius:5px;font:10.5px var(--mono);padding:2.5px 7px;cursor:pointer}
  .copy:hover{color:var(--ink);border-color:var(--accent)}
  .scrim{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .16s;z-index:8}
  .scrim.on{opacity:1;pointer-events:auto}

  .gview .gotcha{margin-bottom:16px}
  .gview .src{font-size:11px;font-family:var(--mono);color:var(--dimmer);margin-bottom:2px}
  .empty{color:var(--dimmer);padding:40px 0;text-align:center}
  footer{border-top:1px solid var(--line);padding:20px 26px 40px;color:var(--dimmer);font-size:12.5px}
  kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--dim)}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>

<script id="DATA" type="application/json">{"sources":[{"id":"apple-review-rss","name":"Apple customer reviews RSS feed","publisher":"Apple","homepage":"https://itunes.apple.com/us/rss/","description":"The only free route to App Store review text: a paginated JSON feed of up to 500 recent reviews per app, with rating, title, body and app version. Undocumented, unstable, and aggressively rate-limited - it returned a flat 403 for the whole of one build in September 2026 - but there is no supported alternative, and the four obvious substitutes are all closed.","topics":["apps","app store","reviews","text"],"geography":"per-storefront","temporal":{"grain":"per-review, most recent first","updated":"live"},"license":{"name":"unclear - undocumented endpoint","redistribution":"quote individual reviews with attribution to the app; do not redistribute the corpus"},"access":{"auth":"none","formats":["json","xml"],"bulk":false,"size_hint":"50 reviews per page, 10 pages, so 500 per app maximum","rate_limit":"about 5 requests/second is tolerated. Roughly 50/second earned a flat 403 across the whole endpoint for well over an hour.","etiquette":"write one file per app and skip what already exists, so a blocked run resumes instead of restarting"},"probes":[{"id":"reviews-page1","description":"Page 1 for Apple Store app id 375380948","url":"https://itunes.apple.com/us/rss/customerreviews/page=1/id=375380948/sortby=mostrecent/json","min_interval_s":5,"expect":{"body_contains":["feed"]},"note":"A 403 here is the documented behaviour, not a dead endpoint: this feed answered normally earlier on 2026-09-06 and returned 403 after a few dozen requests from the same IP during that day's testing. The block lasted well over an hour when it was first measured. Wait, do not retry."}],"recipes":[{"title":"Resumable review harvest","lang":"python","code":"import json, os, time, urllib.request\ndef fetch(app_id, page):\n    url = ('https://itunes.apple.com/us/rss/customerreviews/'\n           'page=%d/id=%s/sortby=mostrecent/json' % (page, app_id))\n    r = urllib.request.urlopen(url)\n    if r.status != 200:            # a 403 body is HTML and will look like your bug\n        raise SystemExit('blocked at %s page %d' % (app_id, page))\n    return json.load(r)\n\nfor app_id in ['375380948']:\n    out = 'reviews_%s.json' % app_id\n    if os.path.exists(out):        # resume after a block\n        continue\n    rows = []\n    for page in range(1, 11):      # 10 pages x 50 = the 500 ceiling\n        feed = fetch(app_id, page).get('feed', {})\n        entries = feed.get('entry', [])\n        if page == 1:\n            entries = entries[1:]  # entry[0] is the app, not a review\n        if not entries:\n            break\n        rows += entries\n        time.sleep(0.2)\n    json.dump(rows, open(out, 'w'))"}],"gotchas":[{"trap":"Exceeding the rate limit returns 403 with an HTML body, so a json.load raises a decode error and it looks like a parsing bug in your own code.","fix":"Check response.status before parsing, and stop the run on the first 403 rather than hammering."},{"trap":"On page 1, entry[0] is the app itself, not a review. An empty feed omits the entry key entirely rather than returning [].","fix":"Slice off the first entry on page 1 and use .get('entry', [])."},{"trap":"Four obvious substitutes are closed: the older /rss/customerreviews/id= path (same block), amp-api.apps.apple.com (401, wants a bearer token that is in neither the page HTML nor the bundles), the product page's serialized-server-data (only 8 Apple-chosen reviews), and ?see-all=reviews (renders client-side).","fix":"Budget for the RSS feed at 5 req/s, or buy a commercial ASO feed."}],"related":["itunes-search","google-play"],"used_by":["unforced"],"added":"2026-09-06","verified":"2026-09-06","status":"degraded"},{"id":"arxiv","name":"arXiv API","publisher":"Cornell University / arXiv","homepage":"https://info.arxiv.org/help/api/index.html","description":"Search and metadata for 2.5 million preprints in physics, mathematics, computer science, quantitative biology, statistics and economics, as Atom XML. Full text is available as PDF and, in bulk, from a requester-pays S3 bucket. The place to see a field's output weeks or years before journals catch up.","topics":["research","preprints","physics","machine learning"],"geography":"global","temporal":{"start":"1991","end":"present","grain":"per-preprint","updated":"daily"},"license":{"name":"metadata CC0; papers keep the author's chosen licence","url":"https://info.arxiv.org/help/license/index.html"},"access":{"auth":"none","formats":["atom xml","pdf","s3 bulk (requester pays)"],"bulk":true,"rate_limit":"one request every 3 seconds, and they enforce it","pagination":"start= and max_results=, max 2000 per call, 30,000 total per query"},"probes":[{"id":"query","url":"https://export.arxiv.org/api/query?search_query=cat:stat.AP&max_results=1","expect":{"body_contains":["<feed","<entry"]}}],"recipes":[{"title":"Newest preprints in a category","lang":"bash","code":"curl -s 'https://export.arxiv.org/api/query?search_query=cat:stat.ME&sortBy=submittedDate&sortOrder=descending&max_results=5' | grep -E '<title>|<published>'"}],"gotchas":[{"trap":"Atom XML only - there is no JSON mode, whatever a wrapper library implies.","fix":"Parse with feedparser or xml.etree; the namespace is http://www.w3.org/2005/Atom."},{"trap":"Faster than one call per 3 seconds gets you a 403 for a while.","fix":"Sleep 3s in the loop. For anything large, use the bulk S3 access instead."},{"trap":"Versions matter: the same paper has v1, v2, v3 with different dates and sometimes different conclusions.","fix":"The id carries the version suffix; decide up front whether you want v1 or latest."}],"related":["openalex","zenodo"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"aws-open-data-registry","name":"Registry of Open Data on AWS","publisher":"Amazon Web Services (community-contributed)","homepage":"https://registry.opendata.aws/","description":"A registry of large public datasets hosted in S3 - satellite imagery, genomics, climate models, road networks, web crawls - each described by a YAML file in a public GitHub repository giving the bucket, region, format, licence and example usage. The practical index for data too big to download, including the NOAA mirrors that replaced several retired FTP endpoints.","topics":["meta-catalog","cloud","big data","registry"],"geography":"global","temporal":{"grain":"per-dataset record","updated":"continuously by pull request"},"license":{"name":"registry metadata is CC-BY 4.0; each dataset states its own licence","url":"https://github.com/awslabs/open-data-registry/blob/main/LICENSE"},"access":{"auth":"none","auth_note":"the registry itself is public YAML; most listed buckets allow anonymous S3 reads (aws s3 ls --no-sign-request)","formats":["yaml","the datasets themselves in every format"],"bulk":true,"size_hint":"registry is a few MB; the datasets it points at run to petabytes"},"probes":[{"id":"dataset-yaml","description":"One record - the GHCN mirror that replaced NOAA's retired FTP paths","url":"https://raw.githubusercontent.com/awslabs/open-data-registry/main/datasets/noaa-ghcn.yaml","range_bytes":4096,"expect":{"body_contains":["Name:","ARN:"]}},{"id":"registry-index","url":"https://api.github.com/repos/awslabs/open-data-registry/contents/datasets?per_page=1","expect":{"body_contains":["download_url"]}}],"recipes":[{"title":"Find every dataset mentioning a term","lang":"bash","code":"git clone --depth 1 https://github.com/awslabs/open-data-registry\ngrep -il 'bathymetry' open-data-registry/datasets/*.yaml | head\n# then: aws s3 ls --no-sign-request s3://<bucket>/"}],"gotchas":[{"trap":"Records are contributed by the data owners and are not re-verified, so buckets do occasionally move or close.","fix":"Check the ARN with aws s3 ls --no-sign-request before planning a pipeline around it."},{"trap":"'Free' means the data is free; egress out of ype sees a successful request and a JSON parse error.","expect":{"body_contains":["NAME"]}},{"id":"variable-metadata","description":"Variable definitions need no key","url":"https://api.census.gov/data/2023/acs/acs5/variables.json","range_bytes":4096,"expect":{"body_contains":["variables"]}}],"recipes":[{"title":"Population by county for one state","lang":"bash","code":"KEY=your_key_here\ncurl -s \"https://api.census.gov/data/2023/acs/acs5?get=NAME,B01001_001E&for=county:*&in=state:24&key=$KEY\" | head -5\n# Response is an array of arrays; row 0 is the header."}],"gotchas":[{"trap":"A missing key does not return 401. It returns a 302 to an HTML 'Missing Key' page that answers 200, so the failure surfaces as a JSON decode error in your own code.","fix":"Check content-type, or assert the body starts with '[['."},{"trap":"The response is an array of arrays with the header in row 0, not an array of objects.","fix":"rows = json.load(...); dict(zip(rows[0], r)) for r in rows[1:]."},{"trap":"ACS 5-year and 1-year tables have the same variable ids but different geographies and margins of error.","fix":"1-year covers only areas above 65,000 population. For counties and tracts you almost always want acs5."}],"related":["data-gov"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"crossref","name":"Crossref REST API","publisher":"Crossref","homepage":"https://api.crossref.org","description":"Metadata for ~165 million DOIs registered by publishers - titles, authors, dates, funders, licences, references where the publisher deposits them. The registration authority for most scholarly DOIs, so it is the authoritative answer to 'what is this DOI'.","topics":["bibliometrics","research","doi","citations"],"geography":"global","temporal":{"start":"1600s via retrodigitised deposits","end":"present","grain":"per-work","updated":"continuously"},"license":{"name":"metadata is open (CC0-equivalent facts); abstracts carry publisher terms","url":"https://www.crossref.org/documentation/retrieve-metadata/rest-api/","redistribution":"metadata freely redistributable"},"access":{"auth":"email-in-user-agent","auth_note":"anonymous works; adding mailto= puts you in the polite pool with far better latency","formats":["json"],"bulk":true,"size_hint":"annual public data file is ~185 GB compressed","rate_limit":"published in the X-Rate-Limit-Limit response header, typically 50/second in the polite pool","pagination":"cursor=* with next-cursor; rows max 1000"},"probes":[{"id":"works-query","url":"https://api.crossref.org/works?query.bibliographic=retraction&rows=1&mailto=tnril@users.noreply.github.com","expect":{"body_contains":["message","total-results"]}},{"id":"single-doi","url":"https://api.crossref.org/works/10.1038/s41597-023-02462-y?mailto=tnril@users.noreply.github.com","expect":{"body_contains":["DOI"]}}],"recipes":[{"title":"Resolve a DOI to structured metadata","lang":"bash","code":"curl -s 'https://api.crossref.org/works/10.1038/s41597-023-02462-y?mailto=you@example.com' | python3 -m json.tool | head -30"}],"gotchas":[{"trap":"Reference lists are only present when the publisher deposited them, which is roughly 60% of works and heavily skewed by publisher.","fix":"Check is-referenced-by-count and reference-count separately; absence is not evidence of no citations."},{"trap":"Titles and abstracts arrive as arrays and may carry JATS XML tags inside the string.","fix":"Take element [0] and strip tags before indexing text."}],"related":["openalex","retraction-watch"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"data-gov","name":"Data.gov catalog (CKAN API)","publisher":"US General Services Administration","homepage":"https://data.gov/","description":"The US federal open data catalogue - roughly half a million dataset descriptions harvested from federal, state and local publishers. Historically its CKAN API was the standard way to search all of them at once. On 2026-09-06 every documented API path returned 404; the web catalogue itself still loads. Kept here with the evidence, because a link list would still be telling you to call package_search.","topics":["government","meta-catalog","united states"],"geography":"United States","temporal":{"grain":"per-dataset record","updated":"harvested continuously"},"license":{"name":"US Government work; individual datasets carry their publishers' terms"},"access":{"auth":"api-key-free","auth_note":"api.data.gov key, sent as x-api-key, for the api.gsa.gov proxy. The proxy authenticates, then 301s to catalog.data.gov, which is what is 404ing.","formats":["json"],"bulk":false,"pagination":"rows= and start= (CKAN convention)"},"probes":[{"id":"ckan-package-search","description":"The documented endpoint, unauthenticated","url":"https://catalog.data.gov/api/3/action/package_search?q=climate&rows=1","known_broken":"404 with {\"message\":\"Not Found\"} on 2026-09-06. Also tried: /api/action/package_search, /api/3/action/site_read, /api/1/metastore/schemas/dataset/items, /api/4/harvest_sources, and the api.gsa.gov v3 proxy with a key - the proxy authenticates and then 301s straight back to this dead path. catalog.data.gov/dataset now redirects to the catalogue root.","expect":{"body_contains":["\"success\""]}},{"id":"gsa-proxy","description":"The api.gsa.gov v3 proxy, unauthenticated - proves the proxy is up even though the origin is not","url":"https://api.gsa.gov/technology/datagov/v3/action/package_search?q=climate&rows=1","expect":{"status":[403],"body_contains":["API_KEY_MISSING"]}}],"gotchas":[{"trap":"Every tutorial, wrapper library and LLM answer about US open data starts with catalog.data.gov/api/3/action/package_search. It does not answer today.","fix":"Go to the publishing agency's own portal instead - most are CKAN or Socrata and have live APIs. See socrata-portals, and use datacite-re3data to find subject repositories."},{"trap":"The api.gsa.gov proxy makes the failure look like an auth problem: without a key you get a clean 403 API_KEY_MISSING, so it reads as 'I just need a key'. With a key you get a 301 to the dead origin.","fix":"Follow redirects when testing an API gateway, and check what the origin actually returns."}],"see_also":[{"name":"GSA API documentation","url":"https://open.gsa.gov/api/datadotgov/"},{"name":"resources.data.gov catalog API notes","url":"https://resources.data.gov/catalog-api/"}],"related":["socrata-portals","federal-register"],"added":"2026-09-06","verified":"2026-09-06","status":"degraded"},{"id":"data-is-plural","name":"Data Is Plural (structured archive)","publisher":"Jeremy Singer-Vine","homepage":"https://www.data-is-plural.com/","description":"A weekly newsletter of five useful or curious datasets, running since October 2015, with an archive of well over 1,750 entries published as a Google Sheet with one row per dataset - edition, headline, prose description and links. The single richest lead list of unusual open data in existence, and machine-readable, which makes it the natural thing to harvest.","topics":["meta-catalog","lead list","journalism","curation"],"geography":"global","temporal":{"start":"2015-10-21","end":"present","grain":"per-dataset entry","updated":"weekly"},"license":{"name":"archive released for reuse; the newsletter text is the author's","url":"https://www.data-is-plural.com/archive/","redistribution":"link and quote with attribution; do not republish the prose wholesale"},"access":{"auth":"none","formats":["csv (Google Sheets export)","html archive"],"bulk":true,"size_hint":"a few MB of CSV","etiquette":"it is one person's newsletter - subscribe, and credit it when a lead comes from here"},"fields":["edition (date)","position (1-5)","headline","text","links","hattips"],"probes":[{"id":"archive-csv","description":"The whole archive as CSV, via the sheet's export endpoint","url":"https://docs.google.com/spreadsheets/d/1wZhPLMCHKJvwOkP4juclhjFgqIY8fQFMemwKL2c64vk/export?format=csv&gid=0","range_bytes":4096,"expect":{"body_contains":["edition","headline"]}}],"recipes":[{"title":"Mine the archive for a topic","lang":"bash","code":"curl -sL 'https://docs.google.com/spreadsheets/d/1wZhPLMCHKJvwOkP4juclhjFgqIY8fQFMemwKL2c64vk/export?format=csv&gid=0' -o dip.csv\npython3 -c \"import csv;[print(r['edition'], r['headline']) for r in csv.DictReader(open('dip.csv')) if 'tide' in (r['text']+r['headline']).lower()]\""}],"gotchas":[{"trap":"The export URL 307-redirects before it serves the CSV.","fix":"Follow redirects (curl -L). A client that does not will see an empty body and a 307."},{"trap":"Entries go back to 2015 and nobody re-checks the links, so a large share of the URLs are now dead.","fix":"Treat it as a lead list, not a catalogue - which is exactly the division of labour between it and this repository."}],"related":["tidytuesday","aws-open-data-registry"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"datacite-re3data","name":"DataCite Commons and re3data","publisher":"DataCite","homepage":"https://www.re3data.org/","description":"Two connected registries: re3data describes over 3,000 research data repositories worldwide with their subjects, policies, licences and API endpoints; DataCite Commons indexes the DOIs those repositories mint. Between them they answer 'where would data about X live' - the question that comes before any dataset search.","topics":["research data","metadata","registry","meta-catalog"],"geography":"global","temporal":{"start":"2012 (re3data)","end":"present","grain":"per-repository / per-DOI","updated":"continuously"},"license":{"name":"re3data descriptions are CC0","url":"https://www.re3data.org/about","redistribution":"free"},"access":{"auth":"none","formats":["xml (re3data)","json:api (DataCite)"],"bulk":true,"pagination":"DataCite: page[number] and page[size], or cursor for large walks"},"probes":[{"id":"re3data-list","description":"Every registered repository, as one XML index","url":"https://www.re3data.org/api/v1/repositories","range_bytes":4096,"expect":{"body_contains":["<repository>"]}},{"id":"datacite-dois","url":"https://api.datacite.org/dois?query=sea+level&page[size]=1","expect":{"body_contains":["data"]}}],"recipes":[{"title":"Which repositories cover a subject","lang":"bash","code":"curl -s 'https://www.re3data.org/api/v1/repositories?query=oceanography' | grep -o '<name>[^<]*<\/name>' | head -20"}],"gotchas":[{"trap":"The re3data list endpoint returns ids and names only; policies, APIs and licences need a second call per repository.","fix":"GET /api/v1/repository/<id> for the full record, and cache - there are 3,000 of them."},{"trap":"DataCite search is keyword over metadata, not over data contents.","fix":"Expect to follow the DOI to the repository to find out what the columns actually are."}],"related":["zenodo","openalex"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"europe-pmc","name":"Europe PMC REST API","publisher":"EMBL-EBI","homepage":"https://europepmc.org/RestfulWebService","description":"Search across ~45 million life-science abstracts and ~10 million full texts, including preprints, patents and clinical guidelines. Unlike PubMed it returns full text where it is open access, and it exposes the reference and citation lists per article. No key.","topics":["research","biomedical","literature","systematic review"],"geography":"global","temporal":{"start":"1780s via Medline backfiles","end":"present","grain":"per-article","updated":"daily"},"license":{"name":"metadata free to use; full text keeps the article's own licence","url":"https://europepmc.org/Copyright"},"access":{"auth":"none","formats":["json","xml","dc"],"bulk":true,"rate_limit":"be reasonable; they ask for under ~1 request/second sustained","pagination":"cursorMark=* then nextCursorMark; pageSize max 1000"},"probes":[{"id":"search","url":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=malaria&format=json&pageSize=1","expect":{"body_contains":["resultList","hitCount"]}},{"id":"citations","description":"Who cites a given article","url":"https://www.ebi.ac.uk/europepmc/webservices/rest/MED/23245604/citations?format=json&pageSize=1","expect":{"body_contains":["citationList"]}}],"recipes":[{"title":"A systematic-review style query with field tags","lang":"bash","code":"curl -s --data-urlencode 'query=(TITLE:\"evidence synthesis\") AND (PUB_YEAR:[2020 TO 2026])' --data 'format=json&pageSize=5' -G https://www.ebi.ac.uk/europepmc/webservices/rest/search | python3 -m json.tool | head -40"}],"gotchas":[{"trap":"hitCount counts everything the query matched, but only the first 1,000 are reachable by page number.","fix":"Use cursorMark for anything past the first page or two."},{"trap":"The same paper can appear under several sources (MED, PMC, PPR for preprints) with different ids.","fix":"Deduplicate on DOI, not on id."}],"related":["pubmed-eutilities","openalex"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"federal-register","name":"Federal Register API","publisher":"US National Archives / GPO","homepage":"https://www.federalregister.gov/developers/documentation/api/v1","description":"Every rule, proposed rule, notice and presidential document published in the Federal Register since 1994, as clean JSON with full text links, agency tags, comment deadlines and docket numbers. One of the best-designed government APIs in existence: no key, no registration, sensible pagination, honest counts.","topics":["government","regulation","law","united states","text"],"geography":"United States","temporal":{"start":"1994 (full text); 1936 for scanned issues","end":"present","grain":"per-document","updated":"every business day at 06:00 ET"},"license":{"name":"US Government work, public domain","redistribution":"free"},"access":{"auth":"none","formats":["json","csv"],"bulk":true,"rate_limit":"none published; be reasonable","pagination":"page= and per_page= (max 1000); results past 2,000 need date slicing"},"probes":[{"id":"documents","url":"https://www.federalregister.gov/api/v1/documents.json?per_page=1","expect":{"body_contains":["count","results"]}},{"id":"agency-filter","description":"Everything NOAA published in one month","url":"https://www.federalregister.gov/api/v1/documents.json?per_page=1&conditions[agencies][]=national-oceanic-and-atmospheric-administration&conditions[publication_date][gte]=2025-01-01&conditions[publication_date][lte]=2025-01-31","expect":{"body_contains":["count"]}}],"recipes":[{"title":"Rules mentioning a phrase, with comment deadlines","lang":"bash","code":"curl -sG 'https://www.federalregister.gov/api/v1/documents.json' \\\n  --data-urlencode 'conditions[term]=sea level rise' \\\n  --data 'conditions[type][]=RULE&per_page=5&fields[]=title&fields[]=publication_date&fields[]=comments_close_on&fields[]=html_url' \\\n  | python3 -m json.tool | head -40"}],"gotchas":[{"trap":"Asking for no fields[] returns the full document object for every hit, which is large and mostly URLs.","fix":"Always pass fields[] - the API is fast when you do."},{"trap":"Deep paging stops around 2,000 results.","fix":"Slice by publication_date and page within each slice."}],"related":["usaspending","data-gov"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"gbif","name":"GBIF (Global Biodiversity Information Facility)","publisher":"GBIF Secretariat","homepage":"https://techdocs.gbif.org/en/openapi/","description":"Over three billion species occurrence records - a specimen in a museum drawer, a bird logged on eBird, a plant photographed on iNaturalist - each with species, date and coordinates, from more than 2,000 publishing institutions. The single largest open record of where life has been observed.","topics":["biodiversity","ecology","geospatial","science"],"geography":"global","temporal":{"start":"1600s (herbarium specimens)","end":"present","grain":"per-occurrence","updated":"continuously"},"license":{"name":"per-record: CC0, CC-BY or CC-BY-NC","url":"https://www.gbif.org/terms","redistribution":"honour each record's licence; a download DOI is minted for citation"},"access":{"auth":"none","auth_note":"searching is anonymous; large downloads need a free GBIF account and are delivered asynchronously with a DOI","formats":["json","darwin core archive","csv"],"bulk":true,"size_hint":"a full-species download can be several GB","rate_limit":"search API is limited to 100,000 records via paging - past that you must use the download API","pagination":"offset and limit, offset capped at 100,000"},"probes":[{"id":"occurrence-search","url":"https://api.gbif.org/v1/occurrence/search?q=Quercus&limit=1","expect":{"body_contains":["results","count"]}},{"id":"species-match","description":"Resolve a loose name to the accepted taxon","url":"https://api.gbif.org/v1/species/match?name=Quercus%20alba","expect":{"body_contains":["usageKey"]}}],"recipes":[{"title":"Occurrences of one species in a bounding box","lang":"bash","code":"KEY=$(curl -s 'https://api.gbif.org/v1/species/match?name=Danaus%20plexippus' | python3 -c 'import json,sys;print(json.load(sys.stdin)[\"usageKey\"])')\ncurl -s \"https://api.gbif.org/v1/occurrence/search?taxonKey=$KEY&decimalLatitude=38,40&decimalLongitude=-78,-76&limit=5\" | python3 -m json.tool | head -30"}],"gotchas":[{"trap":"Paging past 100,000 records silently stops rather than erroring.","fix":"Use the asynchronous download API for anything larger; it returns a DOI you can cite."},{"trap":"Occurrence records include cultivated plants, zoo animals and fossils.","fix":"Filter on basisOfRecord and establishmentMeans before treating hits as wild observations."},{"trap":"Coordinates are often rounded or obscured for endangered species.","fix":"Check coordinateUncertaintyInMeters and hasGeospatialIssues."}],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"gdelt","name":"GDELT 2.0 Document API","publisher":"The GDELT Project","homepage":"https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/","description":"A running index of world news - hundreds of millions of articles in 65 languages, updated every 15 minutes, searchable by phrase, country, tone, image content and theme. The Document API returns matching articles, timelines of coverage volume, and tone series, without a key. Unusual and genuinely hard to get anywhere else.","topics":["news","text","global","real time","media"],"geography":"global","temporal":{"start":"2017 (Document API window); 1979 in the Event database","end":"present","grain":"per-article, 15-minute updates","updated":"every 15 minutes"},"license":{"name":"GDELT data is free for research and commercial use; article text stays with the publisher","url":"https://www.gdeltproject.org/about.html#termsofuse"},"access":{"auth":"none","formats":["json","csv","html","rss"],"bulk":true,"size_hint":"the raw 15-minute event files are ~100 MB/day","rate_limit":"one request every 5 seconds is the documented rule, enforced with a 429 whose plain-text body says so. Measured behaviour is stricter after a burst: on 2026-09-06 calls at 5-12 second spacing still 429'd for several minutes, and each throttled request took 10-16 seconds to answer at all.","etiquette":"the 429 body is plain text asking you to slow down and pointing heavy users at the bulk files - read it rather than retrying"},"probes":[{"id":"timeline-tone","description":"Coverage volume and tone over time for a query","url":"https://api.gdeltproject.org/api/v2/doc/doc?query=%22sea%20level%22&mode=timelinetone&format=json&timespan=1w","min_interval_s":12,"expect":{"body_contains":["timeline"]},"note":"GDELT's limiter is per IP and shared across modes. Observed on 2026-09-06: after a burst of testing, whichever call came first got a 429 and a later one succeeded - artlist and timelinetone traded places between runs. A single failure here means throttling, not an outage."},{"id":"artlist","url":"https://api.gdeltproject.org/api/v2/doc/doc?query=flooding&mode=artlist&format=json&maxrecords=2","min_interval_s":12,"expect":{"body_contains":["articles"]},"description":"Article list. Throttled far harder than the timeline modes - see the gotcha.","note":"GDELT's limiter is per IP and shared across modes. Observed on 2026-09-06: after a burst of testing, whichever call came first got a 429 and a later one succeeded - artlist and timelinetone traded places between runs. A single failure here means throttling, not an outage."}],"recipes":[{"title":"How much coverage did a phrase get, week by week","lang":"bash","code":"curl -s 'https://api.gdeltproject.org/api/v2/doc/doc?query=%22atmospheric%20river%22&mode=timelinevol&format=json&timespan=3m' | python3 -m json.tool | head -30\n# sleep 5 between calls or you get a 429 that explains itself"}],"gotchas":[{"trap":"Faster than one call per 5 seconds returns HTTP 429 with a plain-text body, so a JSON parser raises a decode error and the real message is never seen.","fix":"Check the status code before parsing, and sleep 5s in any loop."},{"trap":"The limiter is per IP and shared across modes, and it stays hostile for minutes after a burst. Testing a few queries in quick succession puts you in a penalty box where even correct, well-spaced calls 429.","fix":"Space calls at least 5 s apart from the very first one, back off hard on the first 429, and switch to the bulk 15-minute files for anything at volume."},{"trap":"The Document API only reaches back a few years. The deep archive lives in the separate Event and GKG bulk files.","fix":"For long history download the 15-minute CSVs from data.gdeltproject.org, or query the public BigQuery copy."},{"trap":"maxrecords caps at 250 per call.","fix":"Slice by time window rather than paging."}],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"ghcn-daily","name":"GHCN-Daily","publisher":"NOAA NCEI","homepage":"https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily","description":"Daily weather observations from ~120,000 land stations worldwide - max/min temperature, precipitation, snowfall, snow depth - many running back to the 1940s and some to the 1800s. The reference source for 'what was the weather actually like here, every day, for eighty years'.","topics":["climate","weather","time series"],"geography":"global","temporal":{"start":"1750s (a handful; most US stations from the 1940s)","end":"present","grain":"daily","updated":"daily"},"license":{"name":"US Government public domain","url":"https://www.ncei.noaa.gov/access/use-of-noaa-data","redistribution":"free to redistribute; attribution to NOAA NCEI expected"},"access":{"auth":"none","formats":["csv","fixed-width text"],"bulk":true,"size_hint":"one station-CSV is 1-5 MB; the whole archive is ~15 GB","rate_limit":"none published; www.ncei.noaa.gov is slow under load","etiquette":"fetch per station, not the whole archive, unless you really need it"},"fields":["DATE","TMAX and TMIN in tenths of a degree C","PRCP in tenths of a mm","SNOW in mm","SNWD in mm","<ELEMENT>_ATTRIBUTES = MFLAG,QFLAG,SFLAG"],"probes":[{"id":"station-csv","description":"Reagan National (USW00013743), the long gapless record for the DC area","url":"https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00013743.csv","range_bytes":4096,"expect":{"body_contains":["STATION","TMAX"]}},{"id":"legacy-pub-path","description":"The path most tutorials still tell you to use","url":"https://www.ncei.noaa.gov/pub/data/ghcnd/ghcnd-stations.txt","known_broken":"NCEI retired /pub/data/ghcnd/ - every tutorial and blog post older than ~2024 sends you here. Use the AWS mirror in ghcn-stations-inventory instead.","expect":{"body_contains":["USW00013743"]}}],"recipes":[{"title":"One station, quality-flagged values dropped","lang":"python","code":"import csv, io, urllib.request\nurl = 'https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00013743.csv'\nrows = csv.DictReader(io.StringIO(urllib.request.urlopen(url).read().decode()))\nfor r in rows:\n    # QFLAG is the middle character of the ATTRIBUTES triple; non-blank means failed QC\n    if r.get('TMAX') and r['TMAX_ATTRIBUTES'].split(',')[1].strip() == '':\n        print(r['DATE'], int(r['TMAX']) / 10.0)  # tenths of a degree C"}],"gotchas":[{"trap":"The old ncei.noaa.gov/pub/data/ghcnd/* paths 404 now, including the station list and inventory that every tutorial links to.","fix":"Use the AWS Open Data mirror (see ghcn-stations-inventory). The per-station /data/.../access/ CSVs are unaffected."},{"trap":"Temperatures are in tenths of a degree Celsius and precipitation in tenths of a millimetre. Forget the divide and you get a 340 degree August.","fix":"TMAX/10 for C, PRCP/10 for mm."},{"trap":"Failed-QC values are present in the file, not removed.","fix":"Every element has a companion <EL>_ATTRIBUTES of MFLAG,QFLAG,SFLAG. Drop the row when QFLAG is non-blank."}],"related":["ghcn-stations-inventory","open-meteo"],"used_by":["daybook"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"ghcn-stations-inventory","name":"GHCN-Daily station list and inventory (AWS mirror)","publisher":"NOAA, mirrored by the AWS Open Data Sponsorship Program","homepage":"https://registry.opendata.aws/noaa-ghcn/","description":"The two flat files that make GHCN-Daily usable: every station with its latitude, longitude, elevation and name; and an inventory giving, per station and per element, the first and last year of record. Together they let you pick a station by distance and by how long it has been measuring, instead of guessing an identifier.","topics":["climate","weather","reference","geospatial"],"geography":"global","temporal":{"grain":"snapshot","updated":"daily"},"license":{"name":"US Government public domain","redistribution":"free"},"access":{"auth":"none","formats":["fixed-width text"],"bulk":true,"size_hint":"stations 10 MB, inventory 34 MB","etiquette":"S3 public bucket, no credentials needed over HTTPS"},"fields":["ghcnd-stations.txt: ID, LAT, LON, ELEV, STATE, NAME (fixed columns)","ghcnd-inventory.txt: ID, LAT, LON, ELEMENT, FIRSTYEAR, LASTYEAR"],"probes":[{"id":"stations","url":"https://noaa-ghcn-pds.s3.amazonaws.com/ghcnd-stations.txt","range_bytes":4096,"expect":{"body_contains":["ACW000"]}},{"id":"inventory","url":"https://noaa-ghcn-pds.s3.amazonaws.com/ghcnd-inventory.txt","range_bytes":4096,"expect":{"body_contains":["TMAX"]}}],"recipes":[{"title":"Nearest long-running stations to a point","lang":"python","code":"import math, urllib.request\nLAT, LON = 39.029, -77.076   # Kensington, MD\ntxt = urllib.request.urlopen('https://noaa-ghcn-pds.s3.amazonaws.com/ghcnd-stations.txt').read().decode()\nnear = []\nfor line in txt.splitlines():\n    sid, lat, lon = line[0:11], float(line[12:20]), float(line[21:30])\n    d = math.hypot((lat - LAT) * 111, (lon - LON) * 111 * math.cos(math.radians(LAT)))\n    if d < 25: near.append((round(d, 1), sid, line[41:71].strip()))\nfor d, sid, name in sorted(near)[:10]: print(d, sid, name)"}],"gotchas":[{"trap":"Fixed-width, not delimited. Splitting on whitespace breaks on station names with spaces.","fix":"Slice by column position; the layout is documented in readme.txt beside the files."}],"related":["ghcn-daily"],"used_by":["daybook"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"github-api","name":"GitHub REST API","publisher":"GitHub","homepage":"https://docs.github.com/rest","description":"Repositories, releases, issues, commits, contributors and code search across the largest public code corpus there is. Useful as a data source in its own right - measuring what people build, when projects die, how fast issues close - and as the delivery mechanism for a large share of the open datasets that live in git.","topics":["software","open source","metadata","text"],"geography":"global","temporal":{"start":"2008","end":"present","grain":"per-event","updated":"live"},"license":{"name":"API metadata is usable under the GitHub terms; repository contents keep their own licences","url":"https://docs.github.com/site-policy"},"access":{"auth":"api-key-free","auth_note":"60 requests/hour anonymous, 5,000/hour with any personal access token, even one with no scopes","formats":["json"],"bulk":false,"rate_limit":"the X-RateLimit-Remaining header is authoritative; search has its own much lower limit of 30/minute","pagination":"Link header with rel=\"next\"; per_page max 100"},"probes":[{"id":"repo","url":"https://api.github.com/repos/rfordatascience/tidytuesday","expect":{"body_contains":["full_name","default_branch"]},"range_bytes":16384},{"id":"contents","description":"Directory listing, which is how you discover files in a data repo","url":"https://api.github.com/repos/awslabs/open-data-registry/contents/datasets?per_page=1","expect":{"body_contains":["download_url"]}},{"id":"git-tree","description":"The listing route that does not truncate at 1,000","url":"https://api.github.com/repos/awslabs/open-data-registry/git/trees/main?recursive=1","range_bytes":8192,"expect":{"body_contains":["\"tree\""]}}],"recipes":[{"title":"Is a data repo still maintained","lang":"bash","code":"curl -s https://api.github.com/repos/OWNER/REPO | python3 -c \"import json,sys;d=json.load(sys.stdin);print(d.get('pushed_at'), d.get('archived'), d.get('stargazers_count'))\"\n# a 404 here is the single fastest way to learn a dataset has been withdrawn"}],"gotchas":[{"trap":"A deleted or renamed repository returns 404 with a generic message, identical to a private repo or a typo.","fix":"Search the API for the name before concluding it is gone - and record the finding, because dataset repos disappear."},{"trap":"Anonymous access is 60 requests/hour, which one loop exhausts instantly.","fix":"Any token, even scopeless, raises it to 5,000/hour."},{"trap":"The contents API silently ignores per_page and page for a directory and returns at most 1,000 entries. Paging through it hands you the same first 1,000 over and over, so a large data repo looks smaller than it is - the AWS open-data registry has ~1,200 dataset files and this route shows 1,000.","fix":"Use the git trees API: /repos/OWNER/REPO/git/trees/BRANCH?recursive=1 returns the whole tree in one response, with a truncated flag when it really is too large."}],"related":["tidytuesday","tennis-open-data"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"google-play","name":"Google Play store listings and review RPC","publisher":"Google (unofficial - scraped, not an API)","homepage":"https://play.google.com/store/apps","description":"Play has no public data API, but the store's own web front end is reachable: search HTML carries package names, the listing page embeds a full metadata blob, and the private batchexecute RPC that powers the reviews tab returns up to 199 reviews per call. Everything below was verified by reading the rendered pages, not from documentation, so treat the offsets as perishable.","topics":["apps","google play","reviews","text","scraping"],"geography":"per-country (gl= parameter)","temporal":{"grain":"snapshot; reviews are per-review with timestamps","updated":"live"},"license":{"name":"unclear - public store pages, no data licence","redistribution":"quote individual reviews with attribution; do not republish the corpus"},"access":{"auth":"scrape","auth_note":"no key and no supported API; you are parsing the site's own payloads","formats":["html with embedded json","batchexecute rpc"],"bulk":false,"size_hint":"~30 results per search query; 199 reviews per RPC call, 3 calls, so about 597 per app","etiquette":"identify yourself with a normal User-Agent, keep concurrency low, and cache aggressively - this is someone's web front end"},"fields":["ds:5 positional array on the listing page","title (1,2,0,0)","developer (1,2,68,0)","installs (1,2,13,0)","score (1,2,51,0,1)","ratings count (1,2,51,2,1)","1-5 star histogram (1,2,51,1,<1..5>,1)","genreId (1,2,79,0,0,2)","description (1,2,72,0,1)"],"probes":[{"id":"search-html","description":"Search results carry package ids in hrefs","url":"https://play.google.com/store/search?q=tennis&c=apps&hl=en&gl=us","headers":{"Accept-Language":"en-US,en;q=0.9"},"range_bytes":1150000,"min_interval_s":3,"expect":{"body_contains":["/store/apps/details?id="]},"note":"Deliberately expensive: the package-name hrefs first appear about 1 MB into the page, so proving the scrape route works costs roughly that much."},{"id":"listing-page","description":"The listing page and its AF_initDataCallback blob","url":"https://play.google.com/store/apps/details?id=com.google.android.apps.maps&hl=en&gl=us","headers":{"Accept-Language":"en-US,en;q=0.9"},"range_bytes":1200000,"min_interval_s":3,"expect":{"body_contains":["AF_initDataCallback"]},"note":"AF_initDataCallback sits about 1.05 MB into a 1.36 MB page. There is no cheaper way to prove the blob is still there."}],"gotchas":[{"trap":"The listing page is ~1.4 MB and the data blob starts around byte 1,050,000. A ranged or truncated read returns a page that looks fine and contains nothing you need.","fix":"Read the whole response before searching for AF_initDataCallback."},{"trap":"The displayed genre is useless for excluding games - Play files Tennis Clash under 'Sports'.","fix":"Read genreId at (1,2,79,0,0,2); games carry a GAME_* value."},{"trap":"The ds:5 blob is a positional unnamed array. Any offset here can move without warning when Google ships a front-end change.","fix":"Assert on a known app before a long run: if Google Maps does not parse, the offsets have moved."},{"trap":"Search returns only about 30 results per query, however you page it.","fix":"Cover the space with many queries and deduplicate on package name."},{"trap":"The reviews RPC response starts with )]}' and a length line before the JSON.","fix":"Strip the first line, parse, then parse [0][2] which is itself a JSON string."}],"related":["itunes-search","apple-review-rss"],"used_by":["unforced"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"hn-algolia","name":"Hacker News Search API (Algolia)","publisher":"Algolia, on behalf of Y Combinator","homepage":"https://hn.algolia.com/api","description":"Full-text search over every Hacker News story and comment since 2007, with points, comment counts, authors and timestamps, as JSON with no key. A convenient corpus for measuring technology attention, and the fastest way to find the discussion thread about anything.","topics":["text","technology","community","attention"],"geography":"global","temporal":{"start":"2007-02","end":"present","grain":"per-item","updated":"within minutes"},"license":{"name":"unspecified; the API is public and widely used for research"},"access":{"auth":"none","formats":["json"],"bulk":false,"rate_limit":"10,000 requests/hour per IP","pagination":"page= and hitsPerPage= (max 1000); use search_by_date with numericFilters for full walks"},"probes":[{"id":"search","url":"https://hn.algolia.com/api/v1/search?query=open%20data&hitsPerPage=1","expect":{"body_contains":["hits","nbHits"]}},{"id":"by-date","url":"https://hn.algolia.com/api/v1/search_by_date?tags=story&numericFilters=created_at_i%3E1700000000&hitsPerPage=1","expect":{"body_contains":["hits"]}}],"recipes":[{"title":"Walk every story matching a term, oldest to newest","lang":"bash","code":"curl -s 'https://hn.algolia.com/api/v1/search_by_date?query=tidytuesday&tags=story&hitsPerPage=20' | python3 -c \"import json,sys;[print(h['created_at'][:10], h['points'], h['title']) for h in json.load(sys.stdin)['hits']]\""}],"gotchas":[{"trap":"/search ranks by relevance and silently caps deep paging; /search_by_date is the one that walks completely.","fix":"For a full crawl use search_by_date plus numericFilters=created_at_i<last_seen and page backwards in time."}],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"huggingface-datasets","name":"Hugging Face Datasets API","publisher":"Hugging Face","homepage":"https://huggingface.co/docs/datasets-server/","description":"Several hundred thousand published datasets with a uniform API: list and filter them, then read rows, splits, column types and summary statistics through the datasets-server without downloading anything. Effectively a machine-learning-shaped index of open data, including a great deal of scraped, derived and annotated material that exists nowhere else.","topics":["machine learning","meta-catalog","text","benchmark"],"geography":"global","temporal":{"start":"2020","end":"present","grain":"per-dataset","updated":"continuously"},"license":{"name":"per-dataset; the hub records each one's declared licence","url":"https://huggingface.co/docs/hub/repositories-licenses","redistribution":"read the dataset card - a lot of hub data is scraped and its licence is aspirational"},"access":{"auth":"api-key-free","auth_note":"public datasets need no token; gated ones need a free account token","formats":["json","parquet","arrow"],"bulk":true,"rate_limit":"unpublished; the datasets-server is the polite way to sample rows","pagination":"limit and offset on /api/datasets; offset and length on /rows"},"probes":[{"id":"list","url":"https://huggingface.co/api/datasets?limit=1","expect":{"body_contains":["id"]}},{"id":"rows","description":"Read rows without downloading the dataset","url":"https://datasets-server.huggingface.co/rows?dataset=rajpurkar%2Fsquad&config=plain_text&split=train&offset=0&length=1","expect":{"body_contains":["rows"]}}],"recipes":[{"title":"Peek at a dataset's schema before downloading gigabytes","lang":"bash","code":"curl -s 'https://datasets-server.huggingface.co/info?dataset=rajpurkar/squad' | python3 -m json.tool | head -40"}],"gotchas":[{"trap":"A declared licence on the hub is whatever the uploader typed. Plenty of 'MIT' datasets are scraped from sources that never granted it.","fix":"For anything you will publish, trace the dataset card back to the original source."},{"trap":"The datasets-server only serves datasets it has converted to parquet, so some large or gated ones return an error rather than rows.","fix":"Check /is-valid before assuming /rows will work."}],"related":["aws-open-data-registry"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"itunes-search","name":"Apple iTunes Search API","publisher":"Apple","homepage":"https://performance-partners.apple.com/search-api","description":"Metadata for everything in Apple's stores - apps, music, podcasts, books, films - by keyword or by id, up to 200 results per query, with no key. For apps it returns price, category, developer, version history dates, description, screenshots, average rating and rating count. The practical census tool for App Store research.","topics":["apps","app store","consumer","text"],"geography":"per-storefront (country= parameter)","temporal":{"grain":"snapshot of current listings","updated":"live"},"license":{"name":"Apple public endpoint; terms permit use for referral and discovery","redistribution":"metadata used for research is normal practice; do not republish in bulk as a competing catalogue"},"access":{"auth":"none","formats":["json"],"bulk":false,"rate_limit":"about 20 calls/minute is the commonly cited ceiling; heavy bursts get throttled","pagination":"none - limit maxes at 200, so you widen the keyword list instead of paging"},"fields":["trackId","trackName","sellerName","primaryGenreName","averageUserRating","userRatingCount (US storefront only)","currentVersionReleaseDate","releaseDate","price"],"probes":[{"id":"search","url":"https://itunes.apple.com/search?term=tennis&entity=software&country=us&limit=2","min_interval_s":3,"expect":{"body_contains":["resultCount","trackId"]},"range_bytes":32768},{"id":"lookup-by-id","url":"https://itunes.apple.com/lookup?id=284882215&country=us","min_interval_s":3,"expect":{"body_contains":["resultCount"]}}],"recipes":[{"title":"Census a keyword space","lang":"python","code":"import json, time, urllib.parse, urllib.request\nseen = {}\nfor term in ['tennis', 'padel', 'pickleball', 'squash', 'badminton']:\n    url = 'https://itunes.apple.com/search?' + urllib.parse.urlencode(\n        {'term': term, 'entity': 'software', 'country': 'us', 'limit': 200})\n    for app in json.load(urllib.request.urlopen(url))['results']:\n        seen[app['trackId']] = app\n    time.sleep(3)\nprint(len(seen), 'distinct apps')"}],"gotchas":[{"trap":"userRatingCount is the US storefront only, while averageUserRating is lifetime across all versions. Dividing one by the other mixes two populations.","fix":"Use userRatingCountForCurrentVersion when you want a like-for-like pair, and say which you used."},{"trap":"200 results is a hard ceiling per query with no paging.","fix":"Cover the space with many keywords and deduplicate on trackId."}],"related":["apple-review-rss","google-play"],"used_by":["unforced"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"natural-earth","name":"Natural Earth","publisher":"Natural Earth (volunteer, NACIS-supported)","homepage":"https://www.naturalearthdata.com/","description":"Public-domain vector and raster basemap data at three scales - countries, states, coastlines, rivers, lakes, roads, urban areas, populated places - designed for cartography rather than analysis. The default answer to 'I need a world map that looks right and I need it in one download'.","topics":["geospatial","cartography","reference","basemap"],"geography":"global","temporal":{"grain":"snapshot","updated":"infrequently; version 5.x is current"},"license":{"name":"Public domain","url":"https://www.naturalearthdata.com/about/terms-of-use/","redistribution":"unrestricted, no attribution required (though it is appreciated)"},"access":{"auth":"none","formats":["shapefile","geopackage","geotiff"],"bulk":true,"size_hint":"110m countries is ~200 KB zipped; 10m physical layers run to tens of MB","etiquette":"the naciscdn.org paths are the CDN the site itself uses; the naturalearthdata.com download links redirect there"},"probes":[{"id":"countries-110m","url":"https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip","range_bytes":2048,"expect":{"content_type":"zip"}},{"id":"coastline-50m","url":"https://naciscdn.org/naturalearth/50m/physical/ne_50m_coastline.zip","range_bytes":2048,"expect":{"content_type":"zip"}}],"recipes":[{"title":"Country outlines as GeoJSON in three commands","lang":"bash","code":"curl -sO https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip\nunzip -o ne_110m_admin_0_countries.zip\nogr2ogr -f GeoJSON countries.json ne_110m_admin_0_countries.shp   # needs GDAL"}],"gotchas":[{"trap":"110m, 50m and 10m are map scales, not resolutions in metres. 110m is the coarsest.","fix":"110m for world maps, 50m for continents, 10m for a country or smaller."},{"trap":"Disputed boundaries have several variants (ne_10m_admin_0_countries, _lakes, _disputed_areas) and they differ politically.","fix":"Pick deliberately and say which you used."}],"related":["nominatim"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"noaa-coops","name":"NOAA Tides and Currents (CO-OPS)","publisher":"NOAA National Ocean Service","homepage":"https://tidesandcurrents.noaa.gov/","description":"Water level, tide predictions, currents, water temperature and meteorology from NOAA's coastal station network, going back over a century at the oldest gauges. The 'datagetter' endpoint answers in JSON, CSV or XML with no key, and the separate metadata API lists the stations and what each one measures.","topics":["ocean","tides","sea level","time series"],"geography":"US coasts and Great Lakes","temporal":{"start":"1854 at the oldest gauge (San Francisco)","end":"present","grain":"6-minute and hourly","updated":"continuously"},"license":{"name":"US Government public domain","redistribution":"free"},"access":{"auth":"none","formats":["json","csv","xml"],"bulk":false,"rate_limit":"31 days per request for 6-minute data, 1 year for hourly - the limit is per request, not per day","etiquette":"pass a descriptive application= parameter; they use it to see who is calling"},"probes":[{"id":"latest-water-level","description":"Baltimore, most recent observed water level","url":"https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=latest&station=8574680&product=water_level&datum=MLLW&units=english&time_zone=gmt&format=json&application=headwaters","expect":{"body_contains":["\"data\""]}},{"id":"station-metadata","url":"https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=waterlevels","range_bytes":4096,"expect":{"body_contains":["stations"]}}],"recipes":[{"title":"A month of six-minute water levels","lang":"bash","code":"curl -s 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=20250101&end_date=20250131&station=8574680&product=water_level&datum=MLLW&units=english&time_zone=lst_ldt&format=csv&application=headwaters' | head -5"}],"gotchas":[{"trap":"An error comes back as HTTP 200 with an {\"error\":{\"message\":...}} body.","fix":"Check for the error key, not the status code."},{"trap":"Datum matters more than units. MLLW, MSL and NAVD88 differ by feet, and the default is not the one you want.","fix":"Always pass datum= explicitly and record which you used."}],"related":["usgs-water"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"noaa-swpc","name":"NOAA Space Weather Prediction Center","publisher":"NOAA SWPC","homepage":"https://www.swpc.noaa.gov/","description":"Live solar and geomagnetic conditions as plain JSON files: planetary K index, solar wind speed and density from DSCOVR, X-ray flux, aurora probability grids. Static files with no key, no query language and no rate limit, which makes them unusually easy to build against.","topics":["space weather","solar","real time"],"geography":"global / near-earth","temporal":{"start":"varies by product; K index back to the 1930s in the archive","end":"present","grain":"1-minute to 3-hourly","updated":"every minute for the live products"},"license":{"name":"US Government public domain","redistribution":"free"},"access":{"auth":"none","formats":["json","txt"],"bulk":true,"size_hint":"most products are under 1 MB","etiquette":"these are cached static files; polling more than once a minute gains nothing"},"probes":[{"id":"k-index","description":"Planetary K index, one-minute estimate","url":"https://services.swpc.noaa.gov/json/planetary_k_index_1m.json","range_bytes":2048,"expect":{"body_contains":["kp_index"]}},{"id":"solar-wind-rtsw","description":"Real-time solar wind plasma from ACE/DSCOVR","url":"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json","range_bytes":2048,"expect":{"body_contains":["proton_speed","proton_density"]}},{"id":"geospace-propagated","description":"Solar wind propagated to the magnetopause - the array-of-arrays shape","url":"https://services.swpc.noaa.gov/products/geospace/propagated-solar-wind-1-hour.json","range_bytes":2048,"expect":{"body_contains":["time_tag","bz"]}},{"id":"retired-plasma-path","description":"The path most tutorials and half of GitHub still use","url":"https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json","known_broken":"SWPC retired /products/solar-wind/plasma-*.json. The live equivalent is /json/rtsw/rtsw_wind_1m.json.","expect":{"body_contains":["density"]}}],"recipes":[{"title":"Is there a geomagnetic storm right now","lang":"bash","code":"curl -s https://services.swpc.noaa.gov/json/planetary_k_index_1m.json | python3 -c \"import json,sys; d=json.load(sys.stdin); print(d[-1]['time_tag'], d[-1]['kp_index'])\""}],"gotchas":[{"trap":"/products/solar-wind/plasma-1-day.json - the path in most tutorials and a lot of live code - now 404s.","fix":"Use /json/rtsw/rtsw_wind_1m.json for plasma and /json/rtsw/rtsw_mag_1m.json for the magnetic field."},{"trap":"The two families have different shapes. /json/* files are arrays of objects; /products/* files are arrays-of-arrays whose first row is the column names.","fix":"Check which family the URL is in before writing the parser, and pop the header row for /products/."},{"trap":"proton_vx_gse and friends are often null even when speed and density are present.","fix":"Do not assume a full record; check per field."}],"related":["usgs-earthquakes"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"nominatim","name":"Nominatim (OpenStreetMap geocoding)","publisher":"OpenStreetMap Foundation","homepage":"https://nominatim.org/release-docs/latest/api/Overview/","description":"Free forward and reverse geocoding over the whole OpenStreetMap database: address to coordinates, coordinates to address, with bounding boxes and administrative hierarchy. The public instance is donated infrastructure with a hard one-request-per-second rule, which is the only real catch.","topics":["geospatial","geocoding","reference"],"geography":"global","temporal":{"grain":"snapshot","updated":"continuously from OSM edits"},"license":{"name":"ODbL 1.0","url":"https://www.openstreetmap.org/copyright","redistribution":"share-alike; derived geodata must carry the same licence and attribute OpenStreetMap contributors"},"access":{"auth":"email-in-user-agent","auth_note":"no key, but a real User-Agent identifying your application is required by the usage policy and enforced","formats":["json","jsonv2","geojson","xml"],"bulk":false,"rate_limit":"1 request per second absolute maximum on the public instance, and no bulk geocoding at all","etiquette":"cache every result; for more than a few thousand lookups, run your own instance or use a bulk geocoder"},"probes":[{"id":"forward","url":"https://nominatim.openstreetmap.org/search?q=Kensington%2C%20Maryland&format=json&limit=1","min_interval_s":1.2,"expect":{"body_contains":["place_id","lat"]}},{"id":"reverse","url":"https://nominatim.openstreetmap.org/reverse?lat=39.029&lon=-77.076&format=json","min_interval_s":1.2,"expect":{"body_contains":["address"]}}],"recipes":[{"title":"Geocode politely","lang":"python","code":"import json, time, urllib.parse, urllib.request\nUA = 'my-project/1.0 (you@example.com)'   # required, and they check\ndef geocode(q):\n    url = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode(\n        {'q': q, 'format': 'json', 'limit': 1})\n    req = urllib.request.Request(url, headers={'User-Agent': UA})\n    hits = json.load(urllib.request.urlopen(req))\n    time.sleep(1.1)                      # the policy, not a suggestion\n    return (float(hits[0]['lat']), float(hits[0]['lon'])) if hits else None"}],"gotchas":[{"trap":"A default urllib or requests User-Agent gets blocked outright - the response is a 403 HTML page, not JSON.","fix":"Set a descriptive User-Agent with a contact address on every call."},{"trap":"ODbL is share-alike. Geocoding a private address list and publishing the result can pull your data into the same licence.","fix":"Read the licence before publishing anything derived from it; for many commercial uses a different geocoder is the safer choice."}],"related":["overpass","natural-earth"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"open-meteo","name":"Open-Meteo","publisher":"Open-Meteo (Zurich)","homepage":"https://open-meteo.com/","description":"Weather forecast and reanalysis history for any coordinate on earth, as JSON, with no API key and no registration. The archive endpoint serves ERA5 back to 1940 at hourly resolution, which makes it the fastest way to get a defensible weather history for a place that has no nearby station.","topics":["weather","climate","forecast","time series"],"geography":"global","temporal":{"start":"1940 (archive)","end":"16 days ahead (forecast)","grain":"hourly","updated":"hourly; archive lags ~5 days"},"license":{"name":"CC-BY-4.0 for the API; underlying models are national weather service open data","url":"https://open-meteo.com/en/license","redistribution":"permitted with attribution; non-commercial free tier"},"access":{"auth":"none","formats":["json","csv","flatbuffers"],"bulk":false,"size_hint":"a year of hourly data for one point is ~1 MB of JSON","rate_limit":"free tier: under 10,000 calls/day, and they mean it - batch coordinates instead of looping","etiquette":"ask for many variables in one call rather than one call per variable; use the &start_date/&end_date form rather than day-by-day loops"},"probes":[{"id":"forecast","url":"https://api.open-meteo.com/v1/forecast?latitude=39.03&longitude=-77.08&hourly=temperature_2m&forecast_days=1","expect":{"body_contains":["temperature_2m","generationtime_ms"]}},{"id":"archive-era5","description":"ERA5 reanalysis, one historical day","url":"https://archive-api.open-meteo.com/v1/archive?latitude=39.03&longitude=-77.08&start_date=1990-07-04&end_date=1990-07-04&daily=temperature_2m_max&timezone=UTC","expect":{"body_contains":["temperature_2m_max"]}}],"recipes":[{"title":"Daily max/min for a decade at one point","lang":"bash","code":"curl -s 'https://archive-api.open-meteo.com/v1/archive?latitude=39.03&longitude=-77.08&start_date=2015-01-01&end_date=2025-01-01&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FNew_York' | head -c 400"}],"gotchas":[{"trap":"The forecast host and the archive host are different services with different date coverage.","fix":"api.open-meteo.com for forecast and recent past, archive-api.open-meteo.com for anything older than about a week."},{"trap":"Reanalysis is a model, not an observation. It will not match the station down the road exactly.","fix":"Use GHCN-Daily when you need what a thermometer actually recorded; use Open-Meteo when you need coverage."}],"related":["ghcn-daily"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"openalex","name":"OpenAlex","publisher":"OurResearch","homepage":"https://openalex.org","description":"An open catalogue of the scholarly record: ~270 million works with authors, institutions, venues, topics, open-access status and full citation graph. Successor to Microsoft Academic Graph, CC0, no key, and the only free source that will hand you per-year citation counts for an arbitrary set of papers.","topics":["bibliometrics","research","citations","graph"],"geography":"global","temporal":{"start":"1600s (sparse); dense from 1950","end":"present","grain":"per-work","updated":"weekly snapshots, continuous API"},"license":{"name":"CC0","url":"https://docs.openalex.org/additional-help/faq","redistribution":"unrestricted"},"access":{"auth":"email-in-user-agent","auth_note":"no key; send mailto= or a User-Agent with an address to reach the polite pool, which is faster and rarely throttled","formats":["json","parquet snapshot on S3"],"bulk":true,"size_hint":"full snapshot ~330 GB; a filtered cursor walk of 135,000 works takes about 3 minutes","rate_limit":"100,000 calls/day, 10/second","pagination":"cursor=* then the returned next_cursor; per-page max 200. The offset-based page= stops working past 10,000 results."},"fields":["doi","publication_year","cited_by_count","counts_by_year (per-year citation history)","is_retracted","primary_topic","authorships","open_access.oa_status"],"probes":[{"id":"works-filter","url":"https://api.openalex.org/works?filter=is_retracted:true&per-page=1&mailto=tnril@users.noreply.github.com","expect":{"body_contains":["meta","results"]}},{"id":"cursor-select","description":"The paging idiom that actually scales","url":"https://api.openalex.org/works?filter=publication_year:2024&per-page=2&select=doi,cited_by_count,counts_by_year&cursor=*&mailto=tnril@users.noreply.github.com","expect":{"body_contains":["next_cursor"]}}],"recipes":[{"title":"Walk a filtered set with a cursor","lang":"python","code":"import json, urllib.parse, urllib.request\nBASE = 'https://api.openalex.org/works'\nparams = {'filter': 'is_retracted:true', 'per-page': '200',\n          'select': 'doi,publication_year,cited_by_count,counts_by_year',\n          'mailto': 'you@example.com', 'cursor': '*'}\nwhile params['cursor']:\n    url = BASE + '?' + urllib.parse.urlencode(params)\n    page = json.load(urllib.request.urlopen(url))\n    for w in page['results']:\n        yearly = {c['year']: c['cited_by_count'] for c in w['counts_by_year']}\n        print(w['doi'], w['cited_by_count'], yearly)\n    params['cursor'] = page['meta']['next_cursor']"}],"gotchas":[{"trap":"In counts_by_year the count key is called cited_by_count, not count. Reading c['count'] gives a KeyError halfway through a long run.","fix":"c['year'], c['cited_by_count']."},{"trap":"counts_by_year only runs from 2012 to the present, whatever the publication year.","fix":"For citation history before 2012 you need a different source; do not read the truncation as zero citations."},{"trap":"is_retracted comes from publisher metadata and over-flags badly - it marks about twice as many works as Retraction Watch has notices for.","fix":"Join to the Retraction Watch database on normalised DOI rather than trusting either alone."},{"trap":"Without select= you pull the entire work object, which is 10-50x the bytes you need.","fix":"Always pass select= with just the fields you use."}],"related":["crossref","retraction-watch"],"used_by":["still-cited"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"openlibrary","name":"Open Library API","publisher":"Internet Archive","homepage":"https://openlibrary.org/developers/api","description":"A catalogue of over 40 million books - editions, works, authors, subjects, covers and, for a large slice, full text searchable through the Internet Archive. Bulk dumps are published monthly. No key, and the search API accepts ISBNs, titles and authors interchangeably.","topics":["books","culture","library","reference"],"geography":"global","temporal":{"start":"printing to present","end":"present","grain":"per-edition","updated":"continuously; monthly bulk dumps"},"license":{"name":"CC0 for the catalogue data","url":"https://openlibrary.org/developers/api","redistribution":"free"},"access":{"auth":"none","formats":["json","bulk tsv dumps"],"bulk":true,"size_hint":"the monthly editions dump is ~10 GB compressed","rate_limit":"unpublished; they ask for under 100 requests/minute and a real User-Agent. In practice the host sheds load well before that - expect resets and multi-second responses, and retry rather than parallelise.","pagination":"offset= and limit=, or page="},"probes":[{"id":"search","url":"https://openlibrary.org/search.json?q=moby+dick&limit=1","expect":{"body_contains":["numFound","docs"]},"note":"openlibrary.org is frequently slow and sheds load: measured 0.4 s, then 6.7 s, then a 30 s timeout and a connection reset within one afternoon on 2026-09-06. Give it a long timeout and retry before reading a failure here as an outage."},{"id":"isbn-lookup","url":"https://openlibrary.org/isbn/9780140449136.json","expect":{"body_contains":["title"]},"note":"openlibrary.org is frequently slow and sheds load: measured 0.4 s, then 6.7 s, then a 30 s timeout and a connection reset within one afternoon on 2026-09-06. Give it a long timeout and retry before reading a failure here as an outage."}],"recipes":[{"title":"Everything an ISBN resolves to","lang":"bash","code":"curl -s 'https://openlibrary.org/api/books?bibkeys=ISBN:9780140449136&format=json&jscmd=data' | python3 -m json.tool | head -30"}],"gotchas":[{"trap":"Works and editions are different objects. A search hit is a work; the ISBN, page count and publisher live on an edition.","fix":"Follow the edition_key from the search result if you need physical details."},{"trap":"Coverage is uneven and crowd-edited, so subjects and dates for older books are frequently wrong.","fix":"Do not treat it as an authority file; cross-check against a library catalogue for anything load-bearing."}],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"our-world-in-data","name":"Our World in Data","publisher":"Global Change Data Lab / University of Oxford","homepage":"https://ourworldindata.org/","description":"Several thousand curated, harmonised long-run indicators on emissions, energy, health, poverty, food, war and democracy - assembled from primary statistical sources, documented, and served as tidy CSV straight off each chart's URL. The fastest route from a question to a defensible, citable time series.","topics":["global development","climate","health","economics","time series"],"geography":"global","temporal":{"start":"varies; some series run to 1750","end":"latest available","grain":"annual mostly","updated":"continuously as upstream sources release"},"license":{"name":"CC-BY 4.0 for OWID's own work; upstream sources keep their terms","url":"https://ourworldindata.org/faqs#can-i-use-or-reproduce-your-data","redistribution":"permitted with attribution to OWID and the underlying source"},"access":{"auth":"none","formats":["csv","json","zip with metadata"],"bulk":true,"size_hint":"a single indicator CSV is typically under 5 MB","etiquette":"append ?v=1&csvType=full to a grapher URL rather than scraping the chart"},"probes":[{"id":"grapher-csv","description":"Any chart's underlying data, as CSV, from the chart's own slug","url":"https://ourworldindata.org/grapher/annual-co2-emissions-per-country.csv?v=1&csvType=full","range_bytes":4096,"expect":{"body_contains":["Entity","Year"]}}],"recipes":[{"title":"Turn any OWID chart into a dataframe","lang":"python","code":"import pandas as pd\nslug = 'annual-co2-emissions-per-country'   # the last path segment of any OWID chart URL\ndf = pd.read_csv('https://ourworldindata.org/grapher/%s.csv?v=1&csvType=full' % slug)\nprint(df.head())\n# metadata for the same chart:\n# https://ourworldindata.org/grapher/<slug>.metadata.json"}],"gotchas":[{"trap":"The Entity column mixes countries, continents and income groups, so a naive sum double-counts.","fix":"Rows with a blank Code, or a Code like OWID_WRL, are aggregates. Filter them out."},{"trap":"OWID harmonises and sometimes rescales upstream data, so figures can differ slightly from the original agency's.","fix":"Cite both OWID and the underlying source; the .metadata.json names it."}],"related":["world-bank"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"overpass","name":"Overpass API (OpenStreetMap query engine)","publisher":"OpenStreetMap community (several public instances)","homepage":"https://wiki.openstreetmap.org/wiki/Overpass_API","description":"A query language over the entire OpenStreetMap database: every cafe in a bounding box, every trail with a given surface tag, every building within 500 m of a school. This is the closest thing there is to a free global spatial database you can ask arbitrary questions of.","topics":["geospatial","openstreetmap","query engine"],"geography":"global","temporal":{"grain":"snapshot","updated":"minutely from OSM edits"},"license":{"name":"ODbL 1.0","url":"https://www.openstreetmap.org/copyright","redistribution":"share-alike, attribution required"},"access":{"auth":"none","formats":["json","xml","csv"],"bulk":true,"size_hint":"a city-sized amenity query is a few hundred KB; a country-sized one can be gigabytes and will be refused","rate_limit":"slot-based, not request-based: GET /api/status tells you your rate limit, slots available and current load","etiquette":"always put [timeout:25] in the query and bound it by bbox or area; unbounded queries are what get instances overloaded"},"probes":[{"id":"status","description":"Your slot allocation and the server's load","url":"https://overpass-api.de/api/status","expect":{"body_contains":["Rate limit"]}},{"id":"small-bbox","description":"A deliberately tiny query - large ones 504 under load","url":"https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A20%5D%3Bnode(39.025%2C-77.080%2C39.030%2C-77.075)%3Bout%201%3B","min_interval_s":3,"expect":{"body_contains":["generator","osm3s"]},"note":"The public instance answers 504 whenever it is busy, which is often. A failure here is usually load, not breakage - check the status probe besid

e it."}],"recipes":[{"title":"Every cafe in a bounding box","lang":"bash","code":"curl -s -G https://overpass-api.de/api/interpreter \\\n  --data-urlencode 'data=[out:json][timeout:25];node(39.02,-77.09,39.04,-77.06)[amenity=cafe];out body;' \\\n  | python3 -c \"import json,sys; [print(e['tags'].get('name'), e['lat'], e['lon']) for e in json.load(sys.stdin)['elements']]\""}],"gotchas":[{"trap":"HTTP 504 from the public instance usually means the server was busy, not that your query was wrong. The same query often succeeds a minute later or with a smaller bbox.","fix":"Check /api/status first, keep [timeout:25] in the query, and back off rather than retrying immediately."},{"trap":"Query results are nodes, ways and relations, not features. A building is a way whose geometry is a list of node ids.","fix":"Ask for 'out geom;' or 'out center;' unless you want to resolve node references yourself."}],"related":["nominatim"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"pubmed-eutilities","name":"NCBI E-utilities","publisher":"US National Library of Medicine","homepage":"https://www.ncbi.nlm.nih.gov/books/NBK25501/","description":"The programmatic door to every NCBI database - PubMed, PMC, GenBank, ClinVar, dbSNP and thirty more - through one small family of endpoints (esearch, efetch, esummary, elink). Old-fashioned and superbly documented, and still the canonical way to run a reproducible literature search.","topics":["research","biomedical","literature","genomics"],"geography":"global","temporal":{"start":"1781 (oldest indexed citation)","end":"present","grain":"per-record","updated":"daily"},"license":{"name":"US Government work; PubMed records are free to use","url":"https://www.ncbi.nlm.nih.gov/home/about/policies/"},"access":{"auth":"api-key-free","auth_note":"works without a key at 3 requests/second; a free NCBI key raises it to 10/second","formats":["json","xml","medline text"],"bulk":true,"rate_limit":"3/second anonymous, 10/second with a key - exceeding it gets your IP blocked, not throttled","pagination":"retstart and retmax; use the history server (usehistory=y) for large sets"},"probes":[{"id":"esearch","url":"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=evidence+synthesis&retmode=json&retmax=1","expect":{"body_contains":["esearchresult","idlist"]}},{"id":"esummary","url":"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=23245604&retmode=json","expect":{"body_contains":["result"]}}],"recipes":[{"title":"Search then fetch, using the history server","lang":"bash","code":"BASE=https://eutils.ncbi.nlm.nih.gov/entrez/eutils\ncurl -s \"$BASE/esearch.fcgi?db=pubmed&term=sea+level+rise&usehistory=y&retmode=json\" > s.json\nQK=$(python3 -c \"import json;d=json.load(open('s.json'))['esearchresult'];print(d['querykey'])\")\nWE=$(python3 -c \"import json;d=json.load(open('s.json'))['esearchresult'];print(d['webenv'])\")\ncurl -s \"$BASE/efetch.fcgi?db=pubmed&query_key=$QK&WebEnv=$WE&retmax=20&rettype=medline&retmode=text\" | head -20"}],"gotchas":[{"trap":"Going over the rate limit gets the IP blocked rather than 429'd, and the block outlasts the run.","fix":"Sleep 0.34s between calls without a key, 0.1s with one, and always send tool= and email=."},{"trap":"efetch for PubMed returns XML even when you ask for retmode=json - only esearch and esummary speak JSON.","fix":"Parse XML for efetch, or use esummary if the summary fields are enough."}],"related":["europe-pmc"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"retraction-watch","name":"Retraction Watch Database (distributed by Crossref)","publisher":"The Center for Scientific Integrity, distributed by Crossref","homepage":"https://www.crossref.org/blog/news-crossref-and-retraction-watch/","description":"The hand-curated census of retractions, expressions of concern and corrections - over 72,000 notices with the retracted paper's DOI, the notice's DOI, dates, country, subject and a coded reason field spanning 112 reasons. Since 2023 Crossref distributes it free under CC0; before that it was a paid licence.","topics":["research integrity","bibliometrics","research"],"geography":"global","temporal":{"start":"1756 (earliest notice)","end":"present","grain":"per-notice","updated":"daily"},"license":{"name":"CC0","url":"https://www.crossref.org/blog/news-crossref-and-retraction-watch/","redistribution":"unrestricted"},"access":{"auth":"email-in-user-agent","auth_note":"the email goes in the query string, with no key and no name: ?you@example.com","formats":["csv"],"bulk":true,"size_hint":"~66 MB CSV, 72,389 rows as of September 2026","etiquette":"one download gets the whole database - do not poll it"},"fields":["Title","Journal","Publisher","Country","Subject","RetractionDate","OriginalPaperDate","OriginalPaperDOI","RetractionDOI","RetractionNature","Reason (semicolon-delimited, 112 coded values)"],"probes":[{"id":"full-csv","description":"The whole database. Ranged so the probe costs 4 KB, not 66 MB.","url":"https://api.labs.crossref.org/data/retractionwatch?tnril@users.noreply.github.com","range_bytes":4096,"expect":{"body_contains":["OriginalPaperDOI","RetractionDate"]},"note":"api.labs.crossref.org generates the CSV on request and 502s under load; it answered in 7 s and 502'd 20 minutes later on 2026-09-06. Retry before concluding anything."}],"recipes":[{"title":"Download and count by reason","lang":"bash","code":"curl -s 'https://api.labs.crossref.org/data/retractionwatch?you@example.com' -o rw.csv\npython3 - <<'EOF'\nimport csv, collections\nc = collections.Counter()\nfor row in csv.DictReader(open('rw.csv', encoding='utf-8-sig')):\n    for reason in row['Reason'].split(';'):\n        if reason.strip(): c[reason.strip()] += 1\nfor reason, n in c.most_common(10): print(n, reason)\nEOF"}],"gotchas":[{"trap":"'Investigation by Journal/Publisher' is the single most common Reason value, and it is a process marker, not a cause. Charting reasons without dropping it produces a meaningless top bar.","fix":"Treat the process markers (investigation by journal, by third party, by company) separately from substantive reasons."},{"trap":"The file is UTF-8 with a BOM.","fix":"Open with encoding='utf-8-sig' or the first column name comes back with a leading zero-width character."},{"trap":"Joining to OpenAlex on the raw DOI string fails often - case and https://doi.org/ prefixes differ between the two.","fix":"Normalise to lowercase bare DOI on both sides. That matched 59,971 of 72,389 in September 2026."}],"related":["openalex","crossref"],"used_by":["still-cited"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"socrata-portals","name":"Socrata Open Data API (state and city portals)","publisher":"Tyler Technologies, deployed by hundreds of governments","homepage":"https://dev.socrata.com/","description":"The engine behind most US state and city open data portals - data.ny.gov, data.cityofchicago.org, data.seattle.gov, healthdata.gov and hundreds more. Every dataset gets the same REST interface with a SQL-like query language (SoQL), so one client works against all of them. With the federal catalogue's API down, this is the practical route to US public-sector data.","topics":["government","cities","meta-catalog","united states"],"geography":"United States, mostly","temporal":{"grain":"varies by dataset","updated":"varies by dataset, often daily"},"license":{"name":"per-portal; most are public domain or CC-BY","redistribution":"check the individual dataset page"},"access":{"auth":"api-key-free","auth_note":"anonymous access works and is throttled by IP; a free app token raises the limit and is passed as X-App-Token","formats":["json","csv","geojson"],"bulk":true,"rate_limit":"strict but unpublished for anonymous callers; generous with an app token","pagination":"$limit and $offset, or $order plus a keyset filter for large walks"},"fields":["Every dataset has a 4x4 id like pmsa-f2ss","$select, $where, $group, $order, $limit - SoQL, close to SQL","/resource/<4x4>.json is the data; /api/views/<4x4>.json is the metadata"],"probes":[{"id":"portal-catalog","description":"Every dataset on one portal","url":"https://data.ny.gov/api/views.json?limit=1","range_bytes":4096,"expect":{"body_contains":["id","name"]}},{"id":"soql-query","description":"SoQL against a live dataset","url":"https://data.cityofchicago.org/resource/ijzp-q8t2.json?$select=primary_type,count(*)&$group=primary_type&$limit=3","expect":{"body_contains":["primary_type"]}},{"id":"discovery-api","description":"Search across every Socrata portal at once","url":"https://api.us.socrata.com/api/catalog/v1?q=air+quality&limit=1","expect":{"body_contains":["results","resource"]}}],"recipes":[{"title":"Aggregate server-side instead of downloading","lang":"bash","code":"curl -s 'https://data.cityofchicago.org/resource/ijzp-q8t2.json?$select=year,count(*)&$group=year&$order=year' | python3 -m json.tool | head -20"}],"gotchas":[{"trap":"The default $limit is 1,000, not 'all'. A loop that never sets $limit silently analyses the first thousand rows.","fix":"Set $limit explicitly and page with $offset, or use the /rows.csv export for the whole table."},{"trap":"$where uses SoQL, not SQL - string literals are single-quoted and dates want ISO with no timezone suffix.","fix":"Test the filter in the portal's own query builder first."},{"trap":"Anonymous requests share an IP throttle, so a fast loop from an office network gets 429s that look like your fault.","fix":"Register a free app token and send X-App-Token."}],"related":["data-gov"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"tennis-open-data","name":"Open professional tennis match data","publisher":"Jeff Sackmann (Match Charting Project) and the Tennismylife community","homepage":"https://github.com/JeffSackmann/tennis_MatchChartingProject","description":"Match-level and point-level results for professional tennis, distributed as CSVs in git. Jeff Sackmann's tennis_atp and tennis_wta - the datasets almost every tennis analytics project has been built on - were 404 on 2026-09-06; his Match Charting Project, with point-by-point data for thousands of charted matches, is alive and was updated the same day. Tennismylife/TML-Database carries ATP results from 1968 to the present in Sackmann's own column layout.","topics":["sport","tennis","match data","time series"],"geography":"global","temporal":{"start":"1968 (TML ATP results); 1970s for charted matches","end":"present","grain":"per-match and per-point","updated":"TML weekly; charting project continuously"},"license":{"name":"Match Charting Project is CC-BY-NC-SA 4.0; TML-Database states no explicit licence","url":"https://github.com/JeffSackmann/tennis_MatchChartingProject#readme","redistribution":"MCP: non-commercial with attribution and share-alike. TML: unstated, so ask before republishing."},"access":{"auth":"none","formats":["csv"],"bulk":true,"size_hint":"charting-m-points-2020s.csv is tens of MB; one TML year file is under 1 MB","etiquette":"clone the repo once rather than fetching raw files in a loop"},"fields":["TML: tourney_id, surface, tourney_level, winner_name, loser_name, winner_rank, score, w_ace, w_df, w_svpt ...","MCP: charting-m-points-*.csv has one row per point with a shot-by-shot notation string"],"probes":[{"id":"mcp-repo","description":"The Match Charting Project, alive","url":"https://api.github.com/repos/JeffSackmann/tennis_MatchChartingProject","expect":{"body_contains":["tennis_MatchChartingProject"]}},{"id":"tml-year-csv","description":"ATP results for the current season","url":"https://raw.githubusercontent.com/Tennismylife/TML-Database/master/2026.csv","range_bytes":4096,"expect":{"body_contains":["tourney_name","winner_name"]}},{"id":"sackmann-atp","description":"The canonical dataset almost every tennis project cites","url":"https://api.github.com/repos/JeffSackmann/tennis_atp","known_broken":"404 on 2026-09-06, as are tennis_wta, tennis_slam_pointbypoint and tennis_pointbypoint. Only tennis_MatchChartingProject remains under that account. Thousands of tutorials, papers and notebooks point at these URLs.","expect":{"body_contains":["full_name"]}}],"recipes":[{"title":"Every match a player won this season","lang":"bash","code":"curl -s https://raw.githubusercontent.com/Tennismylife/TML-Database/master/2026.csv \\\n | python3 -c \"import csv,sys;[print(r['tourney_name'], r['round'], r['loser_name'], r['score']) for r in csv.DictReader(sys.stdin) if 'Sinner' in r['winner_name']]\" | head"}],"gotchas":[{"trap":"Any code or tutorial fetching raw.githubusercontent.com/JeffSackmann/tennis_atp/... breaks today. The failure is a 404 on a raw URL, which is easy to misread as a typo.","fix":"Use Tennismylife/TML-Database for ATP match results - same column layout - and check for an archived copy before assuming the history is lost."},{"trap":"The Match Charting Project is crowd-charted, so coverage is deep but not representative: big matches are over-sampled.","fix":"Do not treat it as a random sample of professional tennis."}],"see_also":[{"name":"Tennismylife/TML-Database","url":"https://github.com/Tennismylife/TML-Database","note":"ATP 1968-present in Sackmann's schema, updated weekly"},{"name":"serve-and-volley/atp-world-tour-tennis-data","url":"https://github.com/serve-and-volley/atp-world-tour-tennis-data","note":"independent scraper, still active"}],"related":["github-api"],"added":"2026-09-06","verified":"2026-09-06","status":"degraded"},{"id":"tidytuesday","name":"TidyTuesday","publisher":"Data Science Learning Community","homepage":"https://github.com/rfordatascience/tidytuesday","description":"A weekly community data project: every Monday a curated, cleaned dataset lands in a public repository with a readme describing its columns and provenance, and thousands of people publish visualisations of it. Running since 2018, so the repository is now a well-documented archive of ~400 tidy datasets on almost every subject.","topics":["meta-catalog","teaching","curation","community"],"geography":"global","temporal":{"start":"2018-04","end":"present","grain":"one dataset per week","updated":"weekly, Mondays"},"license":{"name":"per-dataset; each week's readme names the original source and its terms","url":"https://github.com/rfordatascience/tidytuesday/blob/main/README.md","redistribution":"the repo is a teaching mirror - cite the original source"},"access":{"auth":"none","formats":["csv","xlsx","rds"],"bulk":true,"size_hint":"most weeks are under 5 MB","pagination":"directory listing per year: data/<year>/<YYYY-MM-DD>/"},"probes":[{"id":"year-index","description":"This year's weeks","url":"https://api.github.com/repos/rfordatascience/tidytuesday/contents/data/2026","range_bytes":8192,"expect":{"body_contains":["2026-"]}},{"id":"week-file","description":"An arbitrary historical week's data file","url":"https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2018/2018-04-02/us_avg_tuition.xlsx","range_bytes":2048,"expect":{"content_type":"octet-stream"}}],"recipes":[{"title":"List every week and its files","lang":"bash","code":"for y in 2024 2025 2026; do\n  curl -s \"https://api.github.com/repos/rfordatascience/tidytuesday/contents/data/$y\" \\\n    | python3 -c \"import json,sys;[print(d['path']) for d in json.load(sys.stdin)]\"\ndone"}],"gotchas":[{"trap":"Weekly folders hold the data files and a readme.md, but the readme is the only description of the columns.","fix":"Fetch data/<year>/<date>/readme.md alongside the data; it names the original source, which is what you should cite."},{"trap":"The datasets are cleaned for teaching, sometimes subset or simplified relative to the original.","fix":"Use it to learn the shape of a dataset, then go to the source for analysis you will publish."}],"related":["data-is-plural","github-api"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"usaspending","name":"USAspending API","publisher":"US Department of the Treasury","homepage":"https://api.usaspending.gov/","description":"Every federal contract, grant, loan and direct payment - who received it, from which agency, for what, and where the recipient is - covering more than $10 trillion of awards since 2008. Search is a POST API with a rich filter object; agency and reference lookups are plain GETs.","topics":["government","spending","economics","united states"],"geography":"United States","temporal":{"start":"FY2008","end":"present","grain":"per-award and per-transaction","updated":"twice monthly"},"license":{"name":"US Government work, public domain","redistribution":"free"},"access":{"auth":"none","formats":["json","csv bulk download"],"bulk":true,"size_hint":"the bulk award archives run to tens of GB per fiscal year","rate_limit":"none published; the search endpoint is heavy, so page rather than widen","pagination":"page and limit inside the POST body; limit max 100 for search"},"probes":[{"id":"toptier-agencies","url":"https://api.usaspending.gov/api/v2/references/toptier_agencies/","range_bytes":4096,"expect":{"body_contains":["toptier_code","agency_name"]},"note":"Reachable, but this endpoint's TLS chain was rejected by Python's OpenSSL 3.5 on the machine that ran the probes on 2026-09-06 ('self-signed certificate in certificate chain') while curl against the same host, on the same bundle, returned 200. A grey dot here is a fact about the prober, not about USAspending."},{"id":"award-search","description":"POST search - the endpoint that does the real work","method":"POST","url":"https://api.usaspending.gov/api/v2/search/spending_by_award/","headers":{"Content-Type":"application/json"},"body":"{\"filters\":{\"award_type_codes\":[\"A\",\"B\",\"C\",\"D\"],\"time_period\":[{\"start_date\":\"2024-01-01\",\"end_date\":\"2024-03-31\"}]},\"fields\":[\"Award ID\",\"Recipient Name\",\"Award Amount\"],\"limit\":2,\"page\":1}","expect":{"body_contains":["results"]},"note":"Reachable, but this endpoint's TLS chain was rejected by Python's OpenSSL 3.5 on the machine that ran the probes on 2026-09-06 ('self-signed certificate in certificate chain') while curl against the same host, on the same bundle, returned 200. A grey dot here is a fact about the prober, not about USAspending."}],"recipes":[{"title":"Largest contracts in a quarter","lang":"bash","code":"curl -s -X POST https://api.usaspending.gov/api/v2/search/spending_by_award/ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"filters\":{\"award_type_codes\":[\"A\",\"B\",\"C\",\"D\"],\"time_period\":[{\"start_date\":\"2024-01-01\",\"end_date\":\"2024-03-31\"}]},\"fields\":[\"Award ID\",\"Recipient Name\",\"Award Amount\",\"Awarding Agency\"],\"sort\":\"Award Amount\",\"order\":\"desc\",\"limit\":10}' | python3 -m json.tool | head -40"}],"gotchas":[{"trap":"The fields list uses human-readable labels with spaces and exact capitalisation ('Award ID', not award_id). A wrong label is a 400 with a long validation message.","fix":"Read the endpoint's docs page for the exact label list; they differ per award type."},{"trap":"award_type_codes is required on the award search and there is no 'everything' value.","fix":"A, B, C, D are contracts; 02-05 grants; 07, 08 loans; 06, 10 direct payments."}],"related":["federal-register"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"usgs-earthquakes","name":"USGS Earthquake Catalog (FDSN event service)","publisher":"US Geological Survey","homepage":"https://earthquake.usgs.gov/fdsnws/event/1/","description":"Every earthquake the USGS has located, queryable by time, place, magnitude and depth, returned as GeoJSON. Also published as rolling summary feeds (past hour through past month) that are ideal for a live map. The catalogue runs back to 1900 for large events.","topics":["geology","hazards","geospatial","real time"],"geography":"global","temporal":{"start":"1900","end":"present","grain":"per-event","updated":"within a minute of detection"},"license":{"name":"US Government public domain","redistribution":"free"},"access":{"auth":"none","formats":["geojson","csv","quakeml","kml"],"bulk":true,"rate_limit":"20,000 events per query; split by time window for more","pagination":"offset= and limit=, or slice by starttime/endtime"},"probes":[{"id":"summary-feed","url":"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_month.geojson","range_bytes":4096,"expect":{"body_contains":["FeatureCollection"]}},{"id":"fdsn-query","url":"https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=2025-01-01&endtime=2025-01-03&minmagnitude=5","range_bytes":4096,"expect":{"body_contains":["FeatureCollection"]}}],"recipes":[{"title":"Everything above M6 in a decade, as CSV","lang":"bash","code":"curl -s 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv&starttime=2015-01-01&endtime=2025-01-01&minmagnitude=6' -o quakes.csv && wc -l quakes.csv"}],"gotchas":[{"trap":"Exceeding the 20,000-event cap returns HTTP 400 with a text explanation, not a truncated list.","fix":"Query count first (.../query?format=geojson&...&count) and split the time window."},{"trap":"Magnitudes come from different scales (mb, ml, mw) and are not strictly comparable.","fix":"The magType field is in every feature; keep it."}],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"usgs-water","name":"USGS Water Services (NWIS)","publisher":"US Geological Survey","homepage":"https://waterservices.usgs.gov/","description":"Streamflow, gage height, water temperature and groundwater level from roughly 1.9 million US monitoring sites, live at 15-minute resolution and historically as daily values back to the 1890s at the oldest gauges. The instantaneous-values service is keyless JSON.","topics":["water","hydrology","environment","time series"],"geography":"United States","temporal":{"start":"1890s (daily values)","end":"present","grain":"15-minute and daily","updated":"continuously"},"license":{"name":"US Government public domain","redistribution":"free"},"access":{"auth":"none","formats":["json","rdb (tab-delimited)","waterml"],"bulk":false,"rate_limit":"no key, but large multi-site multi-year requests are throttled","pagination":"none - you constrain by sites, parameterCd and period instead"},"fields":["parameterCd 00060 = discharge in cubic feet per second","parameterCd 00065 = gage height in feet","parameterCd 00010 = water temperature C"],"probes":[{"id":"instantaneous","description":"Potomac River at Little Falls, current discharge","url":"https://waterservices.usgs.gov/nwis/iv/?format=json&sites=01646500&parameterCd=00060&siteStatus=all","range_bytes":4096,"expect":{"body_contains":["timeSeries"]}},{"id":"daily-values","url":"https://waterservices.usgs.gov/nwis/dv/?format=json&sites=01646500&parameterCd=00060&startDT=2024-01-01&endDT=2024-01-07","expect":{"body_contains":["timeSeries"]}}],"recipes":[{"title":"Every gauge in a county with current flow","lang":"bash","code":"curl -s 'https://waterservices.usgs.gov/nwis/iv/?format=json&countyCd=24031&parameterCd=00060' | head -c 400"}],"gotchas":[{"trap":"An empty result is HTTP 200 with an empty timeSeries array, and a bad site code is a 400 with an HTML body.","fix":"Check both the status and whether timeSeries is non-empty."},{"trap":"Provisional data is served alongside approved data and can be revised or withdrawn.","fix":"The qualifier codes (P = provisional, A = approved) are in the values array; keep them."}],"related":["noaa-coops"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"wikidata","name":"Wikidata Query Service (SPARQL)","publisher":"Wikimedia Foundation","homepage":"https://query.wikidata.org/","description":"A queryable knowledge graph of ~115 million items - people, places, works, species, buildings, elections - with a SPARQL endpoint that will answer questions no tabular source can, like 'every lighthouse in Europe with its construction year and coordinates'. Free, no key, and the results come back as JSON or CSV.","topics":["knowledge graph","reference","sparql","culture"],"geography":"global","temporal":{"grain":"snapshot","updated":"live, seconds behind edits"},"license":{"name":"CC0","url":"https://www.wikidata.org/wiki/Wikidata:Licensing","redistribution":"free"},"access":{"auth":"none","auth_note":"no key; a descriptive User-Agent is required by the policy","formats":["json","csv","tsv","xml"],"bulk":true,"size_hint":"the full dump is ~140 GB compressed","rate_limit":"60 seconds of query time per query, and a concurrency cap per IP; expensive queries are killed rather than queued","etiquette":"put LIMIT on exploratory queries; use the query service's own editor to test before scripting"},"probes":[{"id":"sparql","description":"One instance of Q3918 (university)","url":"https://query.wikidata.org/sparql?query=SELECT%20%3Fs%20WHERE%20%7B%3Fs%20wdt%3AP31%20wd%3AQ3918%7D%20LIMIT%201&format=json","min_interval_s":2,"expect":{"body_contains":["results","bindings"]}}],"recipes":[{"title":"Every lighthouse in a country with coordinates","lang":"bash","code":"Q='SELECT ?item ?itemLabel ?coord WHERE {\n  ?item wdt:P31 wd:Q39715; wdt:P17 wd:Q142; wdt:P625 ?coord.\n  SERVICE wikibase:label { bd:serviceParam wikibase:language \"en\". }\n} LIMIT 20'\ncurl -sG https://query.wikidata.org/sparql -H 'Accept: application/json' \\\n  -H 'User-Agent: my-project/1.0 (you@example.com)' --data-urlencode \"query=$Q\" | python3 -m json.tool | head -30"}],"gotchas":[{"trap":"A query with no LIMIT over a common property times out at 60 seconds and returns an HTML error page.","fix":"Add LIMIT, filter early, and prefer wdt: (truthy) over p:/ps: statement paths unless you need qualifiers."},{"trap":"Labels are not properties. Selecting ?itemLabel without the label service returns nothing.","fix":"Include SERVICE wikibase:label { bd:serviceParam wikibase:language \"en\". }"}],"related":["wikimedia-pageviews"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"wikimedia-pageviews","name":"Wikimedia Pageviews API","publisher":"Wikimedia Foundation","homepage":"https://wikimedia.org/api/rest_v1/","description":"Hourly, daily and monthly view counts for any Wikipedia article in any language since 2015, plus top-article rankings per day. A remarkably clean proxy for public attention: what people looked up, when, and in which language.","topics":["attention","culture","web","time series"],"geography":"global","temporal":{"start":"2015-07 (hourly); 2007 in the older pagecounts dumps","end":"yesterday","grain":"hourly, daily, monthly","updated":"daily, about a day behind"},"license":{"name":"CC0","url":"https://wikimediafoundation.org/wiki/Terms_of_Use","redistribution":"free"},"access":{"auth":"none","auth_note":"no key, but send a real User-Agent - the default library agents are blocked","formats":["json"],"bulk":true,"size_hint":"the raw dumps at dumps.wikimedia.org are ~50 GB/year","rate_limit":"100 requests/second across the REST API; be far below that"},"probes":[{"id":"per-article","url":"https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/Tennis/daily/20250101/20250107","expect":{"body_contains":["items","views"]}},{"id":"top-articles","url":"https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/2025/01/01","range_bytes":4096,"expect":{"body_contains":["articles"]}}],"recipes":[{"title":"Daily views for one article over a year","lang":"bash","code":"curl -s -H 'User-Agent: my-project/1.0 (you@example.com)' \\\n  'https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/Wimbledon/daily/20240101/20241231' \\\n  | python3 -c \"import json,sys;[print(i['timestamp'][:8], i['views']) for i in json.load(sys.stdin)['items'][:10]]\""}],"gotchas":[{"trap":"The article title must be exactly as it appears in the URL, with underscores, and it is case sensitive after the first letter.","fix":"Resolve the title through the Wikipedia API first; redirects are counted separately from their target."},{"trap":"agent=all-agents includes bots and spiders and can be several times the human number.","fix":"Use /user/ unless you specifically want automated traffic."}],"related":["wikidata"],"added":"2026-09-06","verified":"2026-09-06","status":"live"},{"id":"world-bank","name":"World Bank Indicators API","publisher":"The World Bank","homepage":"https://datahelpdesk.worldbank.org/knowledgebase/articles/889392","description":"About 16,000 time series for every country and aggregate region - GDP, population, emissions, literacy, life expectancy, energy use - most running from 1960 to the most recent reporting year. No key, stable URLs, and the same query shape for every indicator, which makes it the easiest cross-country panel to assemble.","topics":["economics","development","global","time series"],"geography":"global","temporal":{"start":"1960","end":"present (reporting lags 1-2 years)","grain":"annual","updated":"continuously as countries report"},"license":{"name":"CC-BY-4.0","url":"https://datacatalog.worldbank.org/public-licenses","redistribution":"permitted with attribution"},"access":{"auth":"none","formats":["json","xml"],"bulk":true,"pagination":"page= and per_page= (max 32,500). The JSON response is a two-element array: [metadata, rows]."},"probes":[{"id":"indicator","url":"https://api.worldbank.org/v2/country/US/indicator/NY.GDP.MKTP.CD?format=json&per_page=2","expect":{"body_contains":["indicator","value"]}},{"id":"indicator-list","url":"https://api.worldbank.org/v2/indicator?format=json&per_page=1","expect":{"body_contains":["sourceNote"]}}],"recipes":[{"title":"One indicator for every country, all years","lang":"bash","code":"curl -s 'https://api.worldbank.org/v2/country/all/indicator/EN.ATM.CO2E.PC?format=json&per_page=20000' -o co2.json\npython3 -c \"import json;d=json.load(open('co2.json'));print(d[0]['total'],'rows');print(d[1][0])\""}],"gotchas":[{"trap":"The top level <script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var SRC = D.sources, H = D.health || {}, R = H.results || {};
  var state = {q:'', mode:'sources', facets:{}};

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ---- health rollup -------------------------------------------------------
  function probeState(sid, pid){
    var r = (R[sid]||{})[pid];
    if(!r) return 'none';
    if(r.ok) return 'ok';
    if(r.known_broken) return 'dead';
    // no HTTP status at all: DNS, TLS or a timeout on the machine that ran the probe.
    // That is a fact about the prober's network, not about the endpoint.
    if(r.status == null && r.error) return 'net';
    return 'bad';
  }
  function srcState(s){
    var any=false, bad=false, live=false, net=false;
    s.probes.forEach(function(p){
      var st = probeState(s.id, p.id);
      if(st!=='none') any=true;
      if(st==='ok') live=true;
      if(st==='bad') bad=true;
      if(st==='net') net=true;
    });
    if(!any) return 'none';
    if(bad) return 'bad';
    if(net && !live) return 'net';
    return live ? 'ok' : 'dead';
  }

  // ---- facets --------------------------------------------------------------
  var FACETS = [
    {key:'topic',  label:'Topic',   get:function(s){ return s.topics; }},
    {key:'auth',   label:'Access',  get:function(s){ return [s.access.auth]; }},
    {key:'bulk',   label:'Bulk',    get:function(s){ return [s.access.bulk ? 'whole dataset' : 'query only']; }},
    {key:'licence',label:'Licence', get:function(s){ return [licBucket(s.license.name)]; }},
    {key:'health', label:'Answering now', get:function(s){ return [{ok:'all probes ok',bad:'a probe failing',dead:'only known-dead',net:'unreachable when last run',none:'unprobed'}[srcState(s)]]; }},
    {key:'status', label:'Record',  get:function(s){ return [s.status||'live']; }}
  ];
  function licBucket(n){
    n = (n||'').toLowerCase();
    if(n.indexOf('cc0')>=0 || n.indexOf('public domain')>=0) return 'public domain / CC0';
    if(n.indexOf('cc-by')>=0 || n.indexOf('cc by')>=0) return 'CC-BY';
    if(n.indexOf('odbl')>=0 || n.indexOf('share')>=0) return 'share-alike';
    if(n.indexOf('unclear')>=0 || n.indexOf('unspecified')>=0 || n.indexOf('unstated')>=0) return 'unclear';
    return 'other / per-record';
  }

  function matches(s){
    for(var k in state.facets){
      var want = state.facets[k]; if(!want) continue;
      var f = FACETS.filter(function(x){return x.key===k;})[0];
      if(f.get(s).indexOf(want) < 0) return false;
    }
    if(!state.q) return true;
    var hay = [s.name, s.publisher, s.description, s.topics.join(' '), s.id,
               (s.fields||[]).join(' '),
               (s.gotchas||[]).map(function(g){return g.trap+' '+(g.fix||'');}).join(' '),
               s.probes.map(function(p){return p.url;}).join(' ')].join(' ').toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(function(t){ return hay.indexOf(t)>=0; });
  }

  function drawFacets(){
    var vis = SRC.filter(matches);
    var html = '';
    FACETS.forEach(function(f){
      var counts = {};
      SRC.forEach(function(s){ f.get(s).forEach(function(v){ counts[v]=(counts[v]||0)+1; }); });
      var keys = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a] || a.localeCompare(b); });
      if(f.key==='topic') keys = keys.slice(0,14);
      html += '<div class="facet"><h3>'+f.label+'</h3>';
      keys.forEach(function(k){
        var on = state.facets[f.key]===k;
        html += '<button class="'+(on?'on':'')+'" data-f="'+esc(f.key)+'" data-v="'+esc(k)+'">'+
                '<span>'+esc(k)+'</span><i>'+counts[k]+'</i></button>';
      });
      html += '</div>';
    });
    document.getElementById('facets').innerHTML = html;
    document.getElementById('facets').querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        var k=b.dataset.f, v=b.dataset.v;
        state.facets[k] = (state.facets[k]===v) ? null : v;
        draw();
      };
    });
    return vis;
  }

  function card(s){
    var st = srcState(s);
    var probeBits = s.probes.map(function(p){ return '<span class="dot '+probeState(s.id,p.id)+'"></span>'; }).join(' ');
    return '<div class="card" data-id="'+esc(s.id)+'">'+
      '<h2><span class="dot '+st+'"></span>'+esc(s.name)+' <span class="pub">'+esc(s.publisher)+'</span></h2>'+
      '<p>'+esc(s.description)+'</p>'+
      '<div class="chips">'+
        s.topics.slice(0,4).map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+
        '<span class="chip k">'+esc(s.access.auth)+'</span>'+
        (s.access.bulk?'<span class="chip k">bulk</span>':'')+
        ((s.gotchas||[]).length?'<span class="chip warnc">'+s.gotchas.length+' trap'+(s.gotchas.length>1?'s':'')+'</span>':'')+
        '<span style="margin-left:auto">'+probeBits+'</span>'+
      '</div></div>';
  }

  function gotchaView(list){
    var out = '<div class="gview">';
    list.forEach(function(s){
      (s.gotchas||[]).forEach(function(g){
        out += '<div class="gotcha"><div class="src">'+esc(s.name)+'</div>'+
               '<div class="t">'+esc(g.trap)+'</div>'+
               (g.fix?'<div class="f"><b>&rarr;</b> '+esc(g.fix)+'</div>':'')+'</div>';
      });
    });
    return out + '</div>';
  }

  function draw(){
    var vis = drawFacets().filter(matches);
    vis.sort(function(a,b){ return a.name.localeCompare(b.name); });
    var listEl = document.getElementById('list');
    if(state.mode==='gotchas'){
      var n = vis.reduce(function(a,s){ return a+(s.gotchas||[]).length; },0);
      document.getElementById('count').textContent = n+' traps recorded across '+vis.length+' sources';
      listEl.innerHTML = n ? gotchaView(vis) : '<div class="empty">nothing matches</div>';
      return;
    }
    document.getElementById('count').textContent =
      vis.length+' of '+SRC.length+' sources'+
      (Object.keys(state.facets).filter(function(k){return state.facets[k];}).length||state.q ? '  ·  filtered' : '');
    listEl.innerHTML = vis.length ? vis.map(card).join('') : '<div class="empty">nothing matches</div>';
    listEl.querySelectorAll('.card').forEach(function(c){
      c.onclick = function(){ open(c.dataset.id); };
    });
  }

  // ---- detail sheet --------------------------------------------------------
  function pre(code, lang){
    return '<pre data-code="'+esc(code)+'"><button class="copy">copy</button>'+esc(code)+'</pre>';
  }
  function open(id){
    var s = SRC.filter(function(x){return x.id===id;})[0]; if(!s) return;
    var h = '';
    h += '<h2>'+esc(s.name)+'</h2><div class="pub">'+esc(s.publisher)+' &middot; <a href="'+esc(s.homepage)+'" target="_blank" rel="noopener">'+esc(s.homepage.replace(/^https?:\/\//,''))+'</a></div>';
    h += '<div class="lede">'+esc(s.description)+'</div>';

    h += '<h4>Facts</h4><table class="kv">';
    var t = s.temporal||{};
    var rows = [
      ['id', s.id],
      ['topics', s.topics.join(', ')],
      ['geography', s.geography],
      ['covers', [t.start, t.end].filter(Boolean).join(' → ') + (t.grain?'  ('+t.grain+')':'')],
      ['updated', t.updated],
      ['licence', s.license.name + (s.license.redistribution ? '  — ' + s.license.redistribution : '')],
      ['auth', s.access.auth + (s.access.auth_note ? '  — ' + s.access.auth_note : '')],
      ['formats', s.access.formats.join(', ')],
      ['bulk', s.access.bulk===undefined ? '' : (s.access.bulk?'the whole dataset is downloadable':'query only')],
      ['size', s.access.size_hint],
      ['rate limit', s.access.rate_limit],
      ['pagination', s.access.pagination],
      ['etiquette', s.access.etiquette],
      ['used by', (s.used_by||[]).join(', ')],
      ['record', (s.status||'live')+', verified '+(s.verified||s.added)]
    ];
    rows.forEach(function(r){ if(r[1]) h += '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'; });
    h += '</table>';

    if((s.gotchas||[]).length){
      h += '<h4>Traps</h4>';
      s.gotchas.forEach(function(g){
        h += '<div class="gotcha"><div class="t">'+esc(g.trap)+'</div>'+
             (g.fix?'<div class="f"><b>&rarr;</b> '+esc(g.fix)+'</div>':'')+'</div>';
      });
    }

    h += '<h4>Probes'+(H.checked?' &middot; last run '+esc(H.checked.replace('T',' ').replace('+00:00','Z')):'')+'</h4>';
    s.probes.forEach(function(p){
      var st = probeState(s.id,p.id), r = (R[s.id]||{})[p.id] || {};
      var label = {ok:'answering', bad:'not answering', dead:'dead, as expected',
                   net:'prober could not connect', none:'not yet probed'}[st];
      h += '<div class="probe"><div class="top"><span class="dot '+st+'"></span><b>'+esc(p.id)+'</b> '+
           '<span style="color:var(--dim);font-size:12.5px">'+esc(p.description||'')+'</span>'+
           '<span class="meta">'+esc(label)+(r.status?' · '+r.status:'')+(r.ms?' · '+r.ms+'ms':'')+'</span></div>'+
           '<code>'+esc((p.method||'GET')+' '+p.url)+'</code>'+
           (p.known_broken?'<div class="note">'+esc(p.known_broken)+'</div>':'')+
           (p.note?'<div class="note">'+esc(p.note)+'</div>':'')+
           (!r.ok && r.error && !p.known_broken ? '<div class="note">'+esc(r.error)+'</div>':'')+
           (!r.ok && r.why && !p.known_broken && !r.error ? '<div class="why">'+esc(r.why.join('; '))+'</div>':'')+
           '</div>';
    });

    if((s.recipes||[]).length){
      h += '<h4>Recipes</h4>';
      s.recipes.forEach(function(rc){
        h += '<div style="font-size:13px;color:var(--dim);margin:0 0 5px">'+esc(rc.title||rc.lang)+'</div>'+pre(rc.code, rc.lang);
      });
    }
    if((s.fields||[]).length){
      h += '<h4>Fields worth knowing</h4><ul style="margin:0;padding-left:18px;color:var(--dim);font-size:13px">'+
           s.fields.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul>';
    }
    if((s.see_also||[]).length){
      h += '<h4>See also</h4><ul style="margin:0;padding-left:18px;font-size:13px">'+
        s.see_also.map(function(x){return '<li><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.name)+'</a>'+
          (x.note?' <span style="color:var(--dim)">&mdash; '+esc(x.note)+'</span>':'')+'</li>';}).join('')+'</ul>';
    }
    if((s.related||[]).length){
      h += '<h4>Related records</h4><div class="chips">'+s.related.map(function(rid){
        return '<span class="chip" style="cursor:pointer" data-go="'+esc(rid)+'">'+esc(rid)+'</span>';}).join('')+'</div>';
    }
    h += '<h4>Raw record</h4><div style="font-size:12.5px;color:var(--dim)">'+
         '<code style="font-family:var(--mono)">sources/'+esc(s.id)+'.json</code> &middot; '+
         '<a href="https://github.com/TNRiley/headwaters/blob/main/sources/'+esc(s.id)+'.json" target="_blank" rel="noopener">on GitHub</a></div>';

    var body = document.getElementById('sheetbody');
    body.innerHTML = h;
    body.querySelectorAll('[data-go]').forEach(function(el){ el.onclick=function(){ open(el.dataset.go); }; });
    body.querySelectorAll('.copy').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        navigator.clipboard.writeText(b.parentNode.dataset.code).then(function(){
          b.textContent='copied'; setTimeout(function(){b.textContent='copy';},1200); });
      };
    });
    document.getElementById('sheet').classList.add('open');
    document.getElementById('scrim').classList.add('on');
    document.getElementById('sheet').scrollTop = 0;
    if(history.replaceState) history.replaceState(null,'','#'+s.id);
  }
  function close(){
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('scrim').classList.remove('on');
    if(history.replaceState) history.replaceState(null,'',location.pathname);
  }
  document.getElementById('closex').onclick = close;
  document.getElementById('scrim').onclick = close;
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') close();
    if(e.key==='/' && document.activeElement!==document.getElementById('q')){
      e.preventDefault(); document.getElementById('q').focus();
    }
  });

  // ---- header stats --------------------------------------------------------
  var np = SRC.reduce(function(a,s){return a+s.probes.length;},0);
  var okc=0, badc=0, deadc=0, netc=0;
  SRC.forEach(function(s){ s.probes.forEach(function(p){
    var st=probeState(s.id,p.id);
    if(st==='ok')okc++; else if(st==='bad')badc++; else if(st==='dead')deadc++; else if(st==='net')netc++; });});
  var traps = SRC.reduce(function(a,s){return a+(s.gotchas||[]).length;},0);
  document.getElementById('stats').innerHTML =
    [['sources',SRC.length,''],['probes',np,''],['answering',okc,'ok'],
     ['not answering',badc,badc?'bad':''],['known dead',deadc,'dead']]
    .concat(netc?[['unreachable',netc,'']]:[])
    .concat([['traps recorded',traps,''],['leads waiting',D.leads_new,'']])
    .map(function(x){ return '<div class="stat '+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'; }).join('');

  document.getElementById('foot').innerHTML =
    'Probes last run <b>'+esc((H.checked||'never').replace('T',' ').replace('+00:00'," UTC"))+'</b>. '+
    'Every record is a JSON file in <a href="https://github.com/TNRiley/headwaters" target="_blank" rel="noopener">the repository</a>; '+
    'run <code style="font-family:var(--mono)">python3 src/probe.py</code> to re-check every endpoint yourself. '+
    '<span style="color:var(--dimmer)">Press <kbd>/</kbd> to search, <kbd>esc</kbd> to close a record.</span>';

  document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value; draw(); });
  document.querySelectorAll('.modes button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.modes button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); state.mode=b.dataset.mode; draw();
    };
  });

  draw();
  if(location.hash) open(location.hash.slice(1));
})();
</script>

</body>
</html>
